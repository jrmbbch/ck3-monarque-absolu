  <text x="300" y="521" text-anchor="middle" font-family="Copperplate, Didot, Georgia, serif" font-size="66" font-weight="bold" fill="url(#gold)" stroke="#3a2205" stroke-width="1.5" letter-spacing="3">ABSOLU</text>
  <text x="300" y="550" text-anchor="middle" font-family="Copperplate, Didot, Georgia, serif" font-size="18" fill="#e8c977" letter-spacing="6">CRUSADER KINGS III</text>
