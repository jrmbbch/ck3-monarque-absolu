 mqa_b_hide_decision_tooltip:0 ""
 mqa_b_hide_decision_ct:0 "Qu'on les cache"
 mqa_b_lucky_7_sub_realm_decision_title:0 "#EMP Monarque Absolu:#! Die Domäne befestigen und rüsten"
 mqa_b_lucky_7_sub_realm_decision_desc:0 "Gründet Tempel und Städte in den leeren Baronien Eurer Grafschaften und füllt dann die Bauplätze Eurer Domäne, einschließlich der Besitztümer Eurer Vasallenbarone, mit den besten Gebäuden, die das Spiel dort erlaubt: zuerst die zum Gelände passende Befestigung, dann die größten Aufgebote, dann Gold. Schwächere Gebäude werden ersetzt, danach wird alles auf die höchste Stufe ausgebaut. Es werden keine Bauplätze hinzugefügt, keine Innovationen nötig."
 mqa_b_lucky_7_sub_realm_decision_tooltip:0 ""
 mqa_b_lucky_7_sub_realm_decision_ct:0 "Aux armes et à l'ouvrage"
 mqa_b_max_domicile_decision_title:0 "#EMP Monarque Absolu:#! Traumhaus"
 mqa_b_max_domicile_decision_desc:0 "Füllt alle freien Plätze Eures Wohnsitzes (Lager, Anwesen, Jurte, Herrenhaus...), innere Plätze eingeschlossen, und baut jedes Gebäude bis zur höchsten Stufe aus. Gebäude mit militärischen Boni zuerst, dann Gold und Ressourcen; Spezialisierungen werden ebenso gewählt."
 mqa_b_max_domicile_decision_tooltip:0 ""
 mqa_b_max_domicile_decision_ct:0 "Rien n'est trop beau pour Versailles"
