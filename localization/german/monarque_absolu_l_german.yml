l_german:
 # Menus
 decision_group_type_mqa:0 "--= Monarque Absolu =--"

 # Traits
 trait_mqa_immortality:0 "Mélusine"
 trait_mqa_immortality_desc:0 "Wie Mélusine, die unsterbliche Fee der Sage, wird dieser Charakter nie älter als 25 aussehen, und nur Stahl oder Gift können seine Herrschaft beenden."
 trait_mqa_immortality_character_desc:0 "Wie Mélusine, die unsterbliche Fee der Sage, wird [ROOT.GetCharacter.GetFirstNameNoTooltip] nie älter als 25 aussehen, und nur Stahl oder Gift können diese Herrschaft beenden."
 trait_mqa_super:0 "Louis XIV"
 trait_mqa_super_desc:0 "«L'État, c'est moi.» Wie der Sonnenkönig besitzt dieser Herrscher unerreichte Werte, unerschöpfliche Truhen, eiserne Gesundheit und einen Hof, der sich jeder Laune beugt."
 trait_mqa_super_character_desc:0 "«L'État, c'est moi.» Wie der Sonnenkönig besitzt [ROOT.GetCharacter.GetFirstNameNoTooltip] unerreichte Werte, unerschöpfliche Truhen, eiserne Gesundheit und einen Hof, der sich jeder Laune beugt."
 trait_mqa_super_governor:0 "Colbert"
 trait_mqa_super_governor_desc:0 "Wie Colbert, der unermüdliche Minister des Sonnenkönigs, lässt dieser Verwalter die Ländereien blühen, Gebäude über Nacht entstehen und jeden Vasallen zahlen, was er schuldet."
 trait_mqa_super_governor_character_desc:0 "Wie Colbert, der unermüdliche Minister des Sonnenkönigs, lässt [ROOT.GetCharacter.GetFirstNameNoTooltip] die Ländereien blühen, Gebäude über Nacht entstehen und jeden Vasallen zahlen, was er schuldet."
 trait_mqa_super_general:0 "Napoléon"
 trait_mqa_super_general_desc:0 "Wie Napoléon führt dieser Feldherr Heere, die schneller marschieren, härter zuschlagen und jede Festung in wenigen Tagen nehmen."
 trait_mqa_super_general_character_desc:0 "Wie Napoléon führt [ROOT.GetCharacter.GetFirstNameNoTooltip] Heere, die schneller marschieren, härter zuschlagen und jede Festung in wenigen Tagen nehmen."

 # Interactions
 mqa_immortal_interaction:0 "Die Gabe der Mélusine verleihen"
 mqa_immortal_interaction_desc:0 "[recipient.GetShortUINameNoTooltip|U] erhält #underline Mélusine#!: kein Altern mehr über 25, kein natürlicher Tod."
 mqa_mortal_interaction:0 "Die Gabe der Mélusine entziehen"
 mqa_mortal_interaction_desc:0 "[recipient.GetShortUINameNoTooltip|U] wird wieder sterblich und altert wie alle anderen."
 mqa_super_interaction:0 "Zum Louis XIV machen"
 mqa_super_interaction_desc:0 "[recipient.GetShortUINameNoTooltip|U] erhält #underline Louis XIV#!: 100 in jedem Wert, gewaltige Einkünfte und Ressourcen, Gesundheit, Fruchtbarkeit, Komplott-Boni und -Schutz sowie weit höhere Domänen- und Vasallengrenzen."
 mqa_unsuper_interaction:0 "Louis XIV entziehen"
 mqa_unsuper_interaction_desc:0 "[recipient.GetShortUINameNoTooltip|U] verliert alle Boni von Louis XIV."
 mqa_super_governor_interaction:0 "Zum Colbert machen"
 mqa_super_governor_interaction_desc:0 "[recipient.GetShortUINameNoTooltip|U] erhält #underline Colbert#!: fast sofortige und kostenlose Bauten, Kontrolle und Entwicklung der Grafschaften, größere Aufgebote und Steuern sowie höhere Abgaben der Vasallen."
 mqa_unsuper_governor_interaction:0 "Colbert entziehen"
 mqa_unsuper_governor_interaction_desc:0 "[recipient.GetShortUINameNoTooltip|U] verliert alle Boni von Colbert."
 mqa_super_general_interaction:0 "Zum Napoléon machen"
 mqa_super_general_interaction_desc:0 "[recipient.GetShortUINameNoTooltip|U] erhält #underline Napoléon#!: überwältigenden Kampfvorteil, blitzschnelle Belagerungen und Märsche, endlosen Nachschub sowie stärkere Waffenknechte und Ritter."
 mqa_unsuper_general_interaction:0 "Napoléon entziehen"
 mqa_unsuper_general_interaction_desc:0 "[recipient.GetShortUINameNoTooltip|U] verliert alle Boni von Napoléon."
 mqa_all_in_one_interaction:0 "Absolute Macht verleihen"
 mqa_all_in_one_interaction_desc:0 "[recipient.GetShortUINameNoTooltip|U] wird zugleich Louis XIV, Colbert und Napoléon."
 mqa_unall_in_one_interaction:0 "Alle Mächte entziehen"
 mqa_unall_in_one_interaction_desc:0 "[recipient.GetShortUINameNoTooltip|U] verliert Louis XIV, Colbert und Napoléon."
 mqa_perfect_bloodline_interaction:0 "Perfekte Blutlinie"
 mqa_perfect_bloodline_interaction_desc:0 "[recipient.GetShortUINameNoTooltip|U] erhält die besten Erbeigenschaften (#EMP Wunderschön, Genie, Göttlich, Fruchtbar#!) und verliert alle genetischen Makel. Leibliche Kinder werden mit denselben Vorzügen geboren und geben sie ihrerseits weiter."
 mqa_unperfect_bloodline_interaction:0 "Perfekte Blutlinie beenden"
 mqa_unperfect_bloodline_interaction_desc:0 "[recipient.GetShortUINameNoTooltip|U] behält die aktuellen Eigenschaften, gibt die perfekte Blutlinie aber nicht mehr an künftige Kinder weiter."
 mqa_max_education_interaction:0 "Vollendete Bildung"
 mqa_max_education_interaction_desc:0 "Die Bildungseigenschaft von [recipient.GetShortUINameNoTooltip] steigt auf die höchste Stufe ihres Pfades."
 mqa_all_perks_interaction:0 "Alle Vorzüge"
 mqa_all_perks_interaction_desc:0 "[recipient.GetShortUINameNoTooltip|U] schaltet auf einmal alle Vorzüge aller Lebensstile frei, samt den Eigenschaften, die jeden Baum krönen."
 mqa_take_title_interaction:0 "Titel an sich reißen"
 mqa_take_title_interaction_desc:0 "Einen der Titel von [recipient.GetShortUINameNoTooltip] an sich reißen, landlose und administrative Titel eingeschlossen."
 mqa_take_title_and_vassals_interaction:0 "Titel samt Vasallen an sich reißen"
 mqa_take_landless_title_interaction:0 "Landlosen Titel an sich reißen"
 mqa_take_realm_interaction:0 "Domäne oder Reich an sich reißen"
 mqa_take_realm_interaction_desc:0 "Alle Titel von [recipient.GetShortUINameNoTooltip] auf einmal an sich reißen, oder das ganze Reich mit den Titeln der Vasallen."
 mqa_take_domain_interaction:0 "Die Domäne an sich reißen"
 mqa_take_domain_as_vassal_interaction:0 "Die Domäne nehmen und dem Lehnsherrn dienen"
 mqa_take_realm_as_vassal_interaction:0 "Das Reich nehmen und dem Lehnsherrn dienen"

 # Decisions
 mqa_show_decision_title:0 "--= #EMP Monarque Absolu:#! Mächte anzeigen =--"
