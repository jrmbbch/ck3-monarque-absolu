 mqa_money_decision_title:0 "#EMP Monarque Absolu:#! Die Truhen füllen"
 mqa_money_decision_desc:0 "+100.000 Gold, Frömmigkeit, Prestige und Bekanntheit, dazu alle anderen Ressourcen, die Ihr nutzt: Legitimität, Einfluss, Verdienst, Schatzkammer, Hofpracht, spirituelle Erfüllung, Herde oder Vorräte."
 mqa_money_decision_tooltip:0 "+100.000 Gold, Frömmigkeit, Prestige und Bekanntheit, dazu alle anderen Ressourcen, die Ihr nutzt: Legitimität, Einfluss, Verdienst, Schatzkammer, Hofpracht, spirituelle Erfüllung, Herde oder Vorräte."
 mqa_money_decision_ct:0 "L'État, c'est moi"
 mqa_subrealm_to_culture_decision_title:0 "#EMP Monarque Absolu:#! Ein Reich, eine Kultur"
 mqa_subrealm_to_culture_decision_desc:0 "Bekehrt Euer Unterreich, Eure Vasallen, Eure Familie und Euer Haus zu Eurer Kultur."
 mqa_subrealm_to_culture_decision_tooltip:0 "Bekehrt Euer Unterreich, Eure Vasallen, Eure Familie und Euer Haus zu Eurer Kultur."
 mqa_subrealm_to_culture_decision_ct:0 "Ainsi soit-il"
 mqa_convert_subrealm_to_religion_decision_title:0 "#EMP Monarque Absolu:#! Ein Reich, ein Glaube"
 mqa_convert_subrealm_to_religion_decision_desc:0 "Bekehrt Euer Unterreich, Eure Vasallen, Eure Familie und Euer Haus zu Eurem Glauben und Eurem Ritus."
 mqa_convert_subrealm_to_religion_decision_tooltip:0 "Bekehrt Euer Unterreich, Eure Vasallen, Eure Familie und Euer Haus zu Eurem Glauben und Eurem Ritus."
 mqa_convert_subrealm_to_religion_decision_ct:0 "Un roi, une foi, une loi"
 mqa_cure_all_decision_title:0 "#EMP Monarque Absolu:#! Leib und Reich heilen"
 mqa_cure_all_decision_desc:0 "Heilt alle Krankheiten im Reich sowie die Wunden und Gebrechen Eurer engsten Verwandten."
 mqa_cure_all_decision_tooltip:0 "Heilt alle Krankheiten in Eurem ganzen Reich sowie die Wunden und Gebrechen von Euch, Euren Ehepartnern, Kindern und Enkeln."
 mqa_cure_all_decision_ct:0 "Le roi te touche, Dieu te guérit"
 mqa_cure_inbred_decision_title:0 "#EMP Monarque Absolu:#! Die Blutlinie läutern"
 mqa_cure_inbred_decision_desc:0 "Befreit Eure engsten Verwandten von jedem erblichen Makel."
 mqa_cure_inbred_decision_tooltip:0 "Entfernt alle negativen Erbeigenschaften, auch verborgene, bei Euch, Euren Ehepartnern, Kindern und Enkeln."
 mqa_cure_inbred_decision_ct:0 "Bon sang ne saurait mentir"

 # Building decisions
 mqa_b_show_decision_title:0 "--= #EMP Monarque Absolu:#! Mächte des Baumeisters anzeigen =--"
 mqa_b_show_decision_desc:0 "Zeigt die Bauentscheidungen von Monarque Absolu an."
