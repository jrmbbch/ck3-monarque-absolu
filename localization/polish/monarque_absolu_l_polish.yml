l_polish:
 # Menus
 interaction_mqa_main:0 "Monarque Absolu"
 decision_group_type_mqa:0 "--= Monarque Absolu =--"

 # Traits
 trait_mqa_immortality:0 "Mélusine"
 trait_mqa_immortality_desc:0 "Jak Mélusine, nieśmiertelna wróżka z legendy, ta postać nigdy nie będzie wyglądać na więcej niż 25 lat, a jej panowanie może zakończyć tylko stal lub trucizna."
 trait_mqa_immortality_character_desc:0 "Jak Mélusine, nieśmiertelna wróżka z legendy – [ROOT.GetCharacter.GetFirstNameNoTooltip] nigdy nie będzie wyglądać na więcej niż 25 lat, a to panowanie może zakończyć tylko stal lub trucizna."
 trait_mqa_super:0 "Louis XIV"
 trait_mqa_super_desc:0 "„L'État, c'est moi.” Jak Król Słońce, ten władca ma niezrównane umiejętności, niewyczerpany skarbiec, żelazne zdrowie i dwór, który ugina się przed każdym kaprysem."
 trait_mqa_super_character_desc:0 "„L'État, c'est moi.” Jak Król Słońce – [ROOT.GetCharacter.GetFirstNameNoTooltip]: niezrównane umiejętności, niewyczerpany skarbiec, żelazne zdrowie i dwór, który ugina się przed każdym kaprysem."
 trait_mqa_super_governor:0 "Colbert"
 trait_mqa_super_governor_desc:0 "Jak Colbert, niestrudzony minister Króla Słońce, ten zarządca sprawia, że ziemie kwitną, budowle wyrastają w jedną noc, a każdy wasal płaci, co winien."
 trait_mqa_super_governor_character_desc:0 "Jak Colbert, niestrudzony minister Króla Słońce – [ROOT.GetCharacter.GetFirstNameNoTooltip] sprawia, że ziemie kwitną, budowle wyrastają w jedną noc, a każdy wasal płaci, co winien."
 trait_mqa_super_general:0 "Napoléon"
 trait_mqa_super_general_desc:0 "Jak Napoléon, ten dowódca prowadzi armie, które maszerują szybciej, uderzają mocniej i zdobywają każdą twierdzę w kilka dni."
 trait_mqa_super_general_character_desc:0 "Jak Napoléon – [ROOT.GetCharacter.GetFirstNameNoTooltip] prowadzi armie, które maszerują szybciej, uderzają mocniej i zdobywają każdą twierdzę w kilka dni."

 # Interactions
 mqa_immortal_interaction:0 "Obdarz darem Mélusine"
 mqa_immortal_interaction_desc:0 "[recipient.GetShortUINameNoTooltip|U] otrzymuje #underline Mélusine#!: koniec starzenia po 25. roku życia, koniec śmierci naturalnej."
 mqa_mortal_interaction:0 "Odbierz dar Mélusine"
 mqa_mortal_interaction_desc:0 "[recipient.GetShortUINameNoTooltip|U] znów jest śmiertelne i będzie się starzeć jak wszyscy."
 mqa_super_interaction:0 "Uczyń Louis XIV"
 mqa_super_interaction_desc:0 "[recipient.GetShortUINameNoTooltip|U] otrzymuje #underline Louis XIV#!: 100 w każdej umiejętności, ogromne dochody i zasoby, zdrowie, płodność, premie i ochronę przed spiskami oraz znacznie wyższe limity domeny i wasali."
 mqa_unsuper_interaction:0 "Odbierz Louis XIV"
 mqa_unsuper_interaction_desc:0 "[recipient.GetShortUINameNoTooltip|U] traci wszystkie premie Louis XIV."
 mqa_super_governor_interaction:0 "Uczyń Colbertem"
 mqa_super_governor_interaction_desc:0 "[recipient.GetShortUINameNoTooltip|U] otrzymuje #underline Colbert#!: niemal natychmiastowe i darmowe budowy, kontrolę i rozwój hrabstw, większe pospolite ruszenie i podatki oraz wyższe świadczenia wasali."
 mqa_unsuper_governor_interaction:0 "Odbierz Colberta"
 mqa_unsuper_governor_interaction_desc:0 "[recipient.GetShortUINameNoTooltip|U] traci wszystkie premie Colberta."
 mqa_super_general_interaction:0 "Uczyń Napoléonem"
 mqa_super_general_interaction_desc:0 "[recipient.GetShortUINameNoTooltip|U] otrzymuje #underline Napoléon#!: miażdżącą przewagę w bitwie, błyskawiczne oblężenia i marsze, niewyczerpane zaopatrzenie oraz silniejszych zbrojnych i rycerzy."
 mqa_unsuper_general_interaction:0 "Odbierz Napoléona"
 mqa_unsuper_general_interaction_desc:0 "[recipient.GetShortUINameNoTooltip|U] traci wszystkie premie Napoléona."
 mqa_all_in_one_interaction:0 "Nadaj władzę absolutną"
 mqa_all_in_one_interaction_desc:0 "[recipient.GetShortUINameNoTooltip|U] zostaje jednocześnie Louis XIV, Colbertem i Napoléonem."
 mqa_unall_in_one_interaction:0 "Odbierz wszystkie moce"
 mqa_unall_in_one_interaction_desc:0 "[recipient.GetShortUINameNoTooltip|U] traci Louis XIV, Colberta i Napoléona."
 mqa_perfect_bloodline_interaction:0 "Doskonały ród"
 mqa_perfect_bloodline_interaction_desc:0 "[recipient.GetShortUINameNoTooltip|U] otrzymuje najlepsze cechy dziedziczne (#EMP Postać piękna, genialna, boska, płodna#!) i traci wszystkie wady genetyczne. Biologiczne dzieci urodzą się z tymi samymi zaletami i przekażą je dalej."
 mqa_unperfect_bloodline_interaction:0 "Zakończ doskonały ród"
 mqa_unperfect_bloodline_interaction_desc:0 "[recipient.GetShortUINameNoTooltip|U] zachowuje obecne cechy, ale nie przekaże już doskonałego rodu przyszłym dzieciom."
 mqa_max_education_interaction:0 "Doskonałe wykształcenie"
 mqa_max_education_interaction_desc:0 "Cecha wykształcenia, którą ma [recipient.GetShortUINameNoTooltip], wzrasta do najwyższego poziomu swojej ścieżki."
 mqa_all_perks_interaction:0 "Wszystkie atuty"
 mqa_all_perks_interaction_desc:0 "[recipient.GetShortUINameNoTooltip|U] odblokowuje naraz wszystkie atuty wszystkich stylów życia wraz z cechami wieńczącymi każde drzewko."
 mqa_take_title_interaction:0 "Zagarnij tytuł"
 mqa_take_title_interaction_desc:0 "Zagarnia jeden z tytułów: [recipient.GetShortUINameNoTooltip], w tym tytuły bez ziemi i administracyjne – sam albo wraz z wasalami, którzy posiadają pod nim ziemie."
 mqa_take_title_only_option:0 "Sam tytuł: wasale zostają przy swoim panu, jeśli nadal ma wyższą rangę"
 mqa_take_title_and_vassals_option:0 "Tytuł i jego wasale: przysięgają ci wierność"
 mqa_take_realm_interaction:0 "Zagarnij wszystkie tytuły"
 mqa_take_realm_interaction_desc:0 "Zagarnia naraz wszystkie tytuły: [recipient.GetShortUINameNoTooltip], albo wszystkie tytuły całego królestwa, w tym hrabstwa i księstwa wasali."
 mqa_take_domain_option:0 "Domena: wasale przysięgają ci wierność"
 mqa_take_realm_option:0 "Całe królestwo: wasale tracą hrabstwa i księstwa"
 mqa_claim_realm_interaction:0 "Zdobądź roszczenia do wszystkich ziem"
 mqa_claim_realm_interaction_desc:0 "Zyskujesz wysuwane roszczenia do tytułów postaci [recipient.GetShortUINameNoTooltip] lub do wszystkich tytułów w jej państwie, włącznie z tytułami wasali. Tytuły i wasale pozostają przy obecnych właścicielach."
 mqa_claim_domain_option:0 "Domena: roszczenia tylko do tytułów posiadanych osobiście"
 mqa_claim_realm_option:0 "Całe państwo: roszczenia do tytułów tej postaci i wszystkich jej wasali"

 # Decisions
 mqa_show_decision_title:0 "--= #EMP Monarque Absolu:#! Pokaż moce =--"
 mqa_show_decision_desc:0 "Pokazuje decyzje Monarque Absolu."
 mqa_show_decision_tooltip:0 ""
 mqa_show_decision_ct:0 "Qu'on les montre"
 mqa_hide_decision_title:0 "--= #EMP Monarque Absolu:#! Ukryj moce =--"
 mqa_hide_decision_desc:0 "Ukrywa decyzje Monarque Absolu."
 mqa_hide_decision_tooltip:0 ""
 mqa_hide_decision_ct:0 "Qu'on les cache"
 mqa_money_decision_title:0 "#EMP Monarque Absolu:#! Napełnij skarbiec"
 mqa_money_decision_desc:0 "+100 000 złota, pobożności, prestiżu i renomy oraz wszystkie inne zasoby, których używasz: prawowitość, wpływy, zasługi, skarbiec, splendor dworu, spełnienie duchowe, stada lub zapasy."
 mqa_money_decision_tooltip:0 "+100 000 złota, pobożności, prestiżu i renomy oraz wszystkie inne zasoby, których używasz: prawowitość, wpływy, zasługi, skarbiec, splendor dworu, spełnienie duchowe, stada lub zapasy."
 mqa_money_decision_ct:0 "L'État, c'est moi"
 mqa_subrealm_to_culture_decision_title:0 "#EMP Monarque Absolu:#! Jedno królestwo, jedna kultura"
 mqa_subrealm_to_culture_decision_desc:0 "Nawraca twoje podkrólestwo, wasali, rodzinę i ród na twoją kulturę."
 mqa_subrealm_to_culture_decision_tooltip:0 "Nawraca twoje podkrólestwo, wasali, rodzinę i ród na twoją kulturę."
 mqa_subrealm_to_culture_decision_ct:0 "Ainsi soit-il"
 mqa_convert_subrealm_to_religion_decision_title:0 "#EMP Monarque Absolu:#! Jedno królestwo, jedna wiara"
 mqa_convert_subrealm_to_religion_decision_desc:0 "Nawraca twoje podkrólestwo, wasali, rodzinę i ród na twoją wiarę i twój obrządek."
 mqa_convert_subrealm_to_religion_decision_tooltip:0 "Nawraca twoje podkrólestwo, wasali, rodzinę i ród na twoją wiarę i twój obrządek."
 mqa_convert_subrealm_to_religion_decision_ct:0 "Un roi, une foi, une loi"
 mqa_gather_realm_decision_title:0 "#EMP Monarque Absolu:#! Zjednoczenie królestwa"
 mqa_gather_realm_decision_desc:0 "Odzyskuje bez wojny każde hrabstwo, księstwo i królestwo, które de iure należy do twoich księstw, królestw i cesarstw, ale jest w posiadaniu kogoś spoza twojego państwa. Hrabstwa przechodzą wraz z baronami. Nic poza twoimi tytułami nie zostaje naruszone, a twoi wasale zachowują to, co posiadają."
 mqa_gather_realm_decision_tooltip:0 ""
 mqa_gather_realm_decision_ct:0 "Montjoie ! Saint-Denis !"
 mqa_gather_realm_decision_effect_tt:0 "Każde hrabstwo, księstwo i królestwo należące de iure do twoich księstw, królestw i cesarstw, a posiadane przez obcego władcę, staje się twoje."
 mqa_council_on_decision_title:0 "#EMP Monarque Absolu:#! Wyjątkowa rada"
 mqa_council_on_decision_desc:0 "Każdy twój doradca otrzymuje +100 do umiejętności swojego stanowiska: dyplomacja dla kanclerza, wojskowość dla marszałka, zarządzanie dla zarządcy, intryga dla mistrza szpiegów, wiedza dla kapelana, w tym ministrowie administracyjni. Nowi doradcy otrzymują premię w ciągu miesiąca; ci, którzy opuszczają radę, ją tracą."
 mqa_council_on_decision_tooltip:0 ""
 mqa_council_on_decision_ct:0 "Le Roi en son Conseil"
 mqa_council_on_decision_effect_tt:0 "Twoi doradcy otrzymują +100 do umiejętności swojego stanowiska, dopóki je zajmują."
 mqa_council_off_decision_title:0 "#EMP Monarque Absolu:#! Zwykła rada"
 mqa_council_off_decision_desc:0 "Twoi doradcy tracą premię wyjątkowej rady."
 mqa_council_off_decision_tooltip:0 ""
 mqa_council_off_decision_ct:0 "Le Conseil est levé"
 mqa_council_off_decision_effect_tt:0 "Twoi doradcy tracą premię +100."
 mqa_council_diplomacy_modifier:0 "Wyjątkowa rada: dyplomacja"
 mqa_council_diplomacy_modifier_desc:0 "+100 do umiejętności stanowiska w radzie, nadane przez władcę."
 mqa_council_martial_modifier:0 "Wyjątkowa rada: wojskowość"
 mqa_council_martial_modifier_desc:0 "+100 do umiejętności stanowiska w radzie, nadane przez władcę."
 mqa_council_stewardship_modifier:0 "Wyjątkowa rada: zarządzanie"
 mqa_council_stewardship_modifier_desc:0 "+100 do umiejętności stanowiska w radzie, nadane przez władcę."
 mqa_council_intrigue_modifier:0 "Wyjątkowa rada: intryga"
 mqa_council_intrigue_modifier_desc:0 "+100 do umiejętności stanowiska w radzie, nadane przez władcę."
 mqa_council_learning_modifier:0 "Wyjątkowa rada: wiedza"
 mqa_council_learning_modifier_desc:0 "+100 do umiejętności stanowiska w radzie, nadane przez władcę."
 mqa_cure_all_decision_title:0 "#EMP Monarque Absolu:#! Ulecz ciała i królestwo"
 mqa_cure_all_decision_desc:0 "Leczy wszystkie choroby w królestwie oraz rany i ułomności twoich najbliższych krewnych."
 mqa_cure_all_decision_tooltip:0 "Leczy wszystkie choroby w całym twoim królestwie oraz rany i kalectwa twoje, twoich małżonków, dzieci i wnuków."
 mqa_cure_all_decision_ct:0 "Le roi te touche, Dieu te guérit"
 mqa_cure_inbred_decision_title:0 "#EMP Monarque Absolu:#! Oczyść ród"
 mqa_cure_inbred_decision_desc:0 "Uwalnia twoich najbliższych krewnych od wszelkich dziedzicznych wad."
 mqa_cure_inbred_decision_tooltip:0 "Usuwa wszystkie negatywne cechy genetyczne, także ukryte, tobie, twoim małżonkom, dzieciom i wnukom."
 mqa_cure_inbred_decision_ct:0 "Bon sang ne saurait mentir"

 # Building decisions
 mqa_b_show_decision_title:0 "--= #EMP Monarque Absolu:#! Pokaż moce budowniczego =--"
 mqa_b_show_decision_desc:0 "Pokazuje decyzje budowlane Monarque Absolu."
 mqa_b_show_decision_tooltip:0 ""
 mqa_b_show_decision_ct:0 "Qu'on les montre"
 mqa_b_hide_decision_title:0 "--= #EMP Monarque Absolu:#! Ukryj moce budowniczego =--"
 mqa_b_hide_decision_desc:0 "Ukrywa decyzje budowlane Monarque Absolu."
 mqa_b_hide_decision_tooltip:0 ""
 mqa_b_hide_decision_ct:0 "Qu'on les cache"
 mqa_b_lucky_7_sub_realm_decision_title:0 "#EMP Monarque Absolu:#! Ufortyfikuj i uzbrój domenę"
 mqa_b_lucky_7_sub_realm_decision_desc:0 "Wypełnia miejsca na budynki i ulepsza budynki w istniejących posiadłościach twoich hrabstw, także baronów wasali, oraz w twoich baroniach poza nimi. Priorytet: fortyfikacje, pospolite ruszenie, dochód, zgodnie z wymaganiami gry. Może zastąpić budynki o niższym priorytecie. Chroni aktywne budowy; bez kosztów, czasu i dodatkowych miejsc. Nie zakłada ani nie przekształca posiadłości i nie nadaje tytułów."
 mqa_b_lucky_7_sub_realm_decision_tooltip:0 "$mqa_b_domain_effect_tt$"
 mqa_b_lucky_7_sub_realm_decision_ct:0 "Aux armes et à l'ouvrage"
 mqa_b_max_domicile_decision_title:0 "#EMP Monarque Absolu:#! Dom marzeń"
 mqa_b_max_domicile_decision_desc:0 "Wypełnia wszystkie wolne miejsca twojej siedziby (obóz, majątek, jurta, dwór...), w tym miejsca wewnętrzne, i rozbudowuje każdą budowlę tak daleko, jak pozwala gra. Powstaje tylko to, co mógłbyś zbudować sam. Najpierw budowle z premiami wojskowymi, potem złoto i zasoby; specjalizacje są wybierane tak samo. Budowa w toku w siedzibie jest najpierw anulowana i zwracana, tak jakbyś anulował ją sam."
 mqa_b_max_domicile_decision_tooltip:0 "$mqa_b_domicile_effect_tt$"
 mqa_b_max_domicile_decision_ct:0 "Rien n'est trop beau pour Versailles"

 # Building decision summaries and diagnostic logs (stable English log markers).
 mqa_b_domain_effect_tt:0 "$mqa_b_lucky_7_sub_realm_decision_desc$"
 mqa_b_domicile_effect_tt:0 "Wypełnia i ulepsza siedzibę zgodnie ze zwykłymi wymaganiami budowy. Trwająca budowa zostaje najpierw anulowana i zwrócony zostaje jej koszt."

 mqa_b_found_holdings_decision_title:0 "#EMP Monarque Absolu:#! Załóż nowe posiadłości"
 mqa_b_found_holdings_decision_desc:0 "Zakłada posiadłości w pustych baroniach poza stolicami twoich hrabstw: brakującą właściwą świątynię (cytadelę świątynną dla mandali), brakujące miasto, następnie zamki, zgodnie z wymaganiami gry. Wyklucza rządy plemienne i koczownicze; chroni aktywne budowy; bez kosztów i czasu. Bez dodatkowych budynków i jawnych nadań; gra może automatycznie przydzielić nowe posiadłości."
 mqa_b_found_holdings_decision_tooltip:0 "$mqa_b_found_holdings_effect_tt$"
 mqa_b_found_holdings_decision_ct:0 "Que ces terres prennent vie"
 mqa_b_found_holdings_effect_tt:0 "$mqa_b_found_holdings_decision_desc$"

 mqa_b_convert_holdings_decision_title:0 "#EMP Monarque Absolu:#! Przekształć posiadłości w zamki"
 mqa_b_convert_holdings_decision_desc:0 "Przekształca twoje odpowiednie posiadłości plemienne, koczownicze i pasterskie w zamki, także stolice hrabstw, według warunków moda. Tylko dla władców nieplemiennych i spoza stepu, w kontrolowanych posiadłościach bez aktywnej budowy. Bez kosztu złota. Nie zakłada posiadłości, nie ulepsza budynków ani nie nadaje tytułów."
 mqa_b_convert_holdings_decision_tooltip:0 "$mqa_b_convert_holdings_effect_tt$"
 mqa_b_convert_holdings_decision_ct:0 "Que s'élèvent les châteaux"
 mqa_b_convert_holdings_effect_tt:0 "$mqa_b_convert_holdings_decision_desc$"

 mqa_b_grant_baronies_decision_title:0 "#EMP Monarque Absolu:#! Nadaj baronie drugorzędne"
 mqa_b_grant_baronies_decision_desc:0 "Nadaje wszystkie odpowiednie osobiście posiadane drugorzędne miasta, świątynie, zamki i cytadele świątynne, stare i nowe, wygenerowanym szlachcicom twojej kultury, wiary i obrządku jako bezpośrednim wasalom. Twoja domena może się zmniejszyć. Chroni stolice hrabstw, aktywne budowy, dzierżawione tytuły i świątynie duchowieństwa; inni baronowie zachowują tytuły. Nie buduje ani nie przekształca posiadłości."
 mqa_b_grant_baronies_decision_tooltip:0 "$mqa_b_grant_baronies_effect_tt$"
 mqa_b_grant_baronies_decision_ct:0 "À chacun sa charge"
 mqa_b_grant_baronies_effect_tt:0 "$mqa_b_grant_baronies_decision_desc$"
