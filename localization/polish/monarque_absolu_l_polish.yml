 mqa_hide_decision_ct:0 "Qu'on les cache"
 mqa_money_decision_title:0 "#EMP Monarque Absolu:#! Napełnij skarbiec"
 mqa_money_decision_desc:0 "+100 000 złota, pobożności, prestiżu i renomy oraz wszystkie inne zasoby, których używasz: prawowitość, wpływy, zasługi, skarbiec, splendor dworu, spełnienie duchowe, stada lub zapasy."
 mqa_money_decision_tooltip:0 "+100 000 złota, pobożności, prestiżu i renomy oraz wszystkie inne zasoby, których używasz: prawowitość, wpływy, zasługi, skarbiec, splendor dworu, spełnienie duchowe, stada lub zapasy."
 mqa_money_decision_ct:0 "L'État, c'est moi"
 mqa_subrealm_to_culture_decision_title:0 "#EMP Monarque Absolu:#! Jedno królestwo, jedna kultura"
 mqa_subrealm_to_culture_decision_desc:0 "Nawraca twoje podkrólestwo, wasali, rodzinę i ród na twoją kulturę."
 mqa_subrealm_to_culture_decision_tooltip:0 "Nawraca twoje podkrólestwo, wasali, rodzinę i ród na twoją kulturę."
 mqa_subrealm_to_culture_decision_ct:0 "Ainsi soit-il"
 mqa_convert_subrealm_to_religion_decision_title:0 "#EMP Monarque Absolu:#! Jedno królestwo, jedna wiara"
 mqa_convert_subrealm_to_religion_decision_desc:0 "Nawraca twoje podkrólestwo, wasali, rodzinę i ród na twoją wiarę i twój obrządek."
 mqa_convert_subrealm_to_religion_decision_tooltip:0 "Nawraca twoje podkrólestwo, wasali, rodzinę i ród na twoją wiarę i twój obrządek."
 mqa_convert_subrealm_to_religion_decision_ct:0 "Un roi, une foi, une loi"
 mqa_cure_all_decision_title:0 "#EMP Monarque Absolu:#! Ulecz ciała i królestwo"
 mqa_cure_all_decision_desc:0 "Leczy wszystkie choroby w królestwie oraz rany i ułomności twoich najbliższych krewnych."
 mqa_cure_all_decision_tooltip:0 "Leczy wszystkie choroby w całym twoim królestwie oraz rany i kalectwa twoje, twoich małżonków, dzieci i wnuków."
 mqa_cure_all_decision_ct:0 "Le roi te touche, Dieu te guérit"
 mqa_cure_inbred_decision_title:0 "#EMP Monarque Absolu:#! Oczyść ród"
 mqa_cure_inbred_decision_desc:0 "Uwalnia twoich najbliższych krewnych od wszelkich dziedzicznych wad."
 mqa_cure_inbred_decision_tooltip:0 "Usuwa wszystkie negatywne cechy genetyczne, także ukryte, tobie, twoim małżonkom, dzieciom i wnukom."
 mqa_cure_inbred_decision_ct:0 "Bon sang ne saurait mentir"

 # Building decisions
 mqa_b_show_decision_title:0 "--= #EMP Monarque Absolu:#! Pokaż moce budowniczego =--"
 mqa_b_show_decision_desc:0 "Pokazuje decyzje budowlane Monarque Absolu."
 mqa_b_show_decision_tooltip:0 ""
 mqa_b_show_decision_ct:0 "Qu'on les montre"
 mqa_b_hide_decision_title:0 "--= #EMP Monarque Absolu:#! Ukryj moce budowniczego =--"
 mqa_b_hide_decision_desc:0 "Ukrywa decyzje budowlane Monarque Absolu."
 mqa_b_hide_decision_tooltip:0 ""
 mqa_b_hide_decision_ct:0 "Qu'on les cache"
 mqa_b_lucky_7_sub_realm_decision_title:0 "#EMP Monarque Absolu:#! Ufortyfikuj i uzbrój domenę"
 mqa_b_lucky_7_sub_realm_decision_desc:0 "Zakłada świątynie i miasta w pustych baroniach twoich hrabstw, a następnie wypełnia miejsca pod budowę w twojej domenie, w tym posiadłości twoich wasalnych baronów, najlepszymi budowlami, na jakie pozwala tam gra: najpierw fortyfikacja dopasowana do terenu, potem największe pospolite ruszenie, potem złoto. Słabsze budowle są zastępowane, a następnie wszystko jest rozbudowywane do maksimum. Żadne miejsce nie jest dodawane, innowacje nie są wymagane."
 mqa_b_lucky_7_sub_realm_decision_tooltip:0 ""
 mqa_b_lucky_7_sub_realm_decision_ct:0 "Aux armes et à l'ouvrage"
 mqa_b_max_domicile_decision_title:0 "#EMP Monarque Absolu:#! Dom marzeń"
 mqa_b_max_domicile_decision_desc:0 "Wypełnia wszystkie wolne miejsca twojej siedziby (obóz, majątek, jurta, dwór...), w tym miejsca wewnętrzne, i rozbudowuje każdą budowlę do maksymalnego poziomu. Najpierw budowle z premiami wojskowymi, potem złoto i zasoby; specjalizacje są wybierane tak samo."
 mqa_b_max_domicile_decision_tooltip:0 ""
 mqa_b_max_domicile_decision_ct:0 "Rien n'est trop beau pour Versailles"
