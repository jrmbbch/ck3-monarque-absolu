l_spanish:
 # Menus
 interaction_mqa_main:0 "Monarque Absolu"
 decision_group_type_mqa:0 "--= Monarque Absolu =--"

 # Traits
 trait_mqa_immortality:0 "Mélusine"
 trait_mqa_immortality_desc:0 "Como Mélusine, el hada inmortal de la leyenda, este personaje nunca aparentará más de 25 años, y solo el acero o el veneno podrán poner fin a su reinado."
 trait_mqa_immortality_character_desc:0 "Como Mélusine, el hada inmortal de la leyenda, [ROOT.GetCharacter.GetFirstNameNoTooltip] nunca aparentará más de 25 años, y solo el acero o el veneno podrán poner fin a este reinado."
 trait_mqa_super:0 "Louis XIV"
 trait_mqa_super_desc:0 "«L'État, c'est moi.» Como el Rey Sol, este soberano tiene habilidades sin igual, arcas sin fondo, salud de hierro y una corte que se doblega ante cada capricho."
 trait_mqa_super_character_desc:0 "«L'État, c'est moi.» Como el Rey Sol, [ROOT.GetCharacter.GetFirstNameNoTooltip] tiene habilidades sin igual, arcas sin fondo, salud de hierro y una corte que se doblega ante cada capricho."
 trait_mqa_super_governor:0 "Colbert"
 trait_mqa_super_governor_desc:0 "Como Colbert, el incansable ministro del Rey Sol, este administrador hace prosperar las tierras, alza edificios de la noche a la mañana y hace pagar a cada vasallo lo que debe."
 trait_mqa_super_governor_character_desc:0 "Como Colbert, el incansable ministro del Rey Sol, [ROOT.GetCharacter.GetFirstNameNoTooltip] hace prosperar las tierras, alza edificios de la noche a la mañana y hace pagar a cada vasallo lo que debe."
 trait_mqa_super_general:0 "Napoléon"
 trait_mqa_super_general_desc:0 "Como Napoléon, este comandante dirige ejércitos que marchan más rápido, golpean más fuerte y toman cualquier fortaleza en pocos días."
 trait_mqa_super_general_character_desc:0 "Como Napoléon, [ROOT.GetCharacter.GetFirstNameNoTooltip] dirige ejércitos que marchan más rápido, golpean más fuerte y toman cualquier fortaleza en pocos días."

 # Interactions
 mqa_immortal_interaction:0 "Conceder el don de Mélusine"
 mqa_immortal_interaction_desc:0 "[recipient.GetShortUINameNoTooltip|U] obtiene #underline Mélusine#!: no envejece más allá de los 25 años ni muere de muerte natural."
 mqa_mortal_interaction:0 "Retirar el don de Mélusine"
 mqa_mortal_interaction_desc:0 "[recipient.GetShortUINameNoTooltip|U] vuelve a ser mortal y envejecerá como todos los demás."
 mqa_super_interaction:0 "Hacer un Louis XIV"
 mqa_super_interaction_desc:0 "[recipient.GetShortUINameNoTooltip|U] obtiene #underline Louis XIV#!: 100 en cada habilidad, enormes ingresos y recursos, salud, fertilidad, bonificaciones y protección frente a conjuras, y límites de dominio y vasallaje mucho mayores."
 mqa_unsuper_interaction:0 "Retirar Louis XIV"
 mqa_unsuper_interaction_desc:0 "[recipient.GetShortUINameNoTooltip|U] pierde todas las bonificaciones de Louis XIV."
 mqa_super_governor_interaction:0 "Hacer un Colbert"
 mqa_super_governor_interaction_desc:0 "[recipient.GetShortUINameNoTooltip|U] obtiene #underline Colbert#!: construcciones casi instantáneas y gratuitas, control y desarrollo de los condados, mayores levas e impuestos y más contribuciones de los vasallos."
 mqa_unsuper_governor_interaction:0 "Retirar Colbert"
 mqa_unsuper_governor_interaction_desc:0 "[recipient.GetShortUINameNoTooltip|U] pierde todas las bonificaciones de Colbert."
 mqa_super_general_interaction:0 "Hacer un Napoléon"
 mqa_super_general_interaction_desc:0 "[recipient.GetShortUINameNoTooltip|U] obtiene #underline Napoléon#!: una ventaja aplastante en combate, asedios y marchas relámpago, suministros inagotables y hombres de armas y caballeros más fuertes."
 mqa_unsuper_general_interaction:0 "Retirar Napoléon"
 mqa_unsuper_general_interaction_desc:0 "[recipient.GetShortUINameNoTooltip|U] pierde todas las bonificaciones de Napoléon."
 mqa_all_in_one_interaction:0 "Conceder el poder absoluto"
 mqa_all_in_one_interaction_desc:0 "[recipient.GetShortUINameNoTooltip|U] se convierte a la vez en Louis XIV, Colbert y Napoléon."
 mqa_unall_in_one_interaction:0 "Retirar todos los poderes"
 mqa_unall_in_one_interaction_desc:0 "[recipient.GetShortUINameNoTooltip|U] pierde Louis XIV, Colbert y Napoléon."
 mqa_perfect_bloodline_interaction:0 "Linaje perfecto"
 mqa_perfect_bloodline_interaction_desc:0 "[recipient.GetShortUINameNoTooltip|U] obtiene los mejores rasgos hereditarios (#EMP Hermoso, Genio, Divino, Fecundo#!) y pierde todos sus defectos genéticos. Sus hijos biológicos nacerán con las mismas ventajas y las transmitirán a su vez."
 mqa_unperfect_bloodline_interaction:0 "Terminar el linaje perfecto"
 mqa_unperfect_bloodline_interaction_desc:0 "[recipient.GetShortUINameNoTooltip|U] conserva sus rasgos actuales, pero ya no transmitirá el linaje perfecto a sus futuros hijos."
 mqa_max_education_interaction:0 "Educación perfecta"
 mqa_max_education_interaction_desc:0 "El rasgo de educación de [recipient.GetShortUINameNoTooltip] sube al nivel más alto de su rama."
 mqa_all_perks_interaction:0 "Todas las ventajas"
 mqa_all_perks_interaction_desc:0 "[recipient.GetShortUINameNoTooltip|U] desbloquea de golpe todas las ventajas de todos los estilos de vida, junto con los rasgos que coronan cada árbol."
 mqa_take_title_interaction:0 "Arrebatar un título"
 mqa_take_title_interaction_desc:0 "Arrebata uno de los títulos de [recipient.GetShortUINameNoTooltip], incluidos los títulos sin tierras y administrativos."
 mqa_take_title_and_vassals_interaction:0 "Arrebatar el título y sus vasallos"
 mqa_take_landless_title_interaction:0 "Arrebatar un título sin tierras"
 mqa_take_realm_interaction:0 "Arrebatar el dominio o el reino"
 mqa_take_realm_interaction_desc:0 "Arrebata de una vez todos los títulos de [recipient.GetShortUINameNoTooltip], o todo su reino con los títulos de sus vasallos."
 mqa_take_domain_interaction:0 "Arrebatar el dominio"
 mqa_take_domain_as_vassal_interaction:0 "Arrebatar el dominio y servir a su señor"
 mqa_take_realm_as_vassal_interaction:0 "Arrebatar el reino y servir a su señor"

 # Decisions
 mqa_show_decision_title:0 "--= #EMP Monarque Absolu:#! Mostrar los poderes =--"
 mqa_show_decision_desc:0 "Muestra las decisiones de Monarque Absolu."
 mqa_show_decision_tooltip:0 ""
 mqa_show_decision_ct:0 "Qu'on les montre"
 mqa_hide_decision_title:0 "--= #EMP Monarque Absolu:#! Ocultar los poderes =--"
 mqa_hide_decision_desc:0 "Oculta las decisiones de Monarque Absolu."
 mqa_hide_decision_tooltip:0 ""
 mqa_hide_decision_ct:0 "Qu'on les cache"
 mqa_money_decision_title:0 "#EMP Monarque Absolu:#! Llenar las arcas"
 mqa_money_decision_desc:0 "+100 000 de oro, piedad, prestigio y renombre, además de todos los demás recursos que uses: legitimidad, influencia, mérito, tesoro, esplendor de la corte, plenitud espiritual, rebaño o provisiones."
 mqa_money_decision_tooltip:0 "+100 000 de oro, piedad, prestigio y renombre, además de todos los demás recursos que uses: legitimidad, influencia, mérito, tesoro, esplendor de la corte, plenitud espiritual, rebaño o provisiones."
 mqa_money_decision_ct:0 "L'État, c'est moi"
 mqa_subrealm_to_culture_decision_title:0 "#EMP Monarque Absolu:#! Un reino, una cultura"
 mqa_subrealm_to_culture_decision_desc:0 "Convierte tu subreino, tus vasallos, tu familia y tu casa a tu cultura."
 mqa_subrealm_to_culture_decision_tooltip:0 "Convierte tu subreino, tus vasallos, tu familia y tu casa a tu cultura."
 mqa_subrealm_to_culture_decision_ct:0 "Ainsi soit-il"
 mqa_convert_subrealm_to_religion_decision_title:0 "#EMP Monarque Absolu:#! Un reino, una fe"
 mqa_convert_subrealm_to_religion_decision_desc:0 "Convierte tu subreino, tus vasallos, tu familia y tu casa a tu fe."
 mqa_convert_subrealm_to_religion_decision_tooltip:0 "Convierte tu subreino, tus vasallos, tu familia y tu casa a tu fe."
 mqa_convert_subrealm_to_religion_decision_ct:0 "Un roi, une foi, une loi"
 mqa_cure_pox_decision_title:0 "#EMP Monarque Absolu:#! Desterrar la enfermedad"
 mqa_cure_pox_decision_desc:0 "Todas las enfermedades del reino se curan de una vez."
 mqa_cure_pox_decision_tooltip:0 "Cura todas las enfermedades de todo tu reino: tú, tu familia y tu casa, tu corte y todos tus vasallos."
 mqa_cure_pox_decision_ct:0 "Le roi te touche, Dieu te guérit"
 mqa_cure_all_decision_title:0 "#EMP Monarque Absolu:#! Sanar cuerpos y reino"
 mqa_cure_all_decision_desc:0 "Cura todas las enfermedades del reino, y las heridas y dolencias de tus parientes más cercanos."
 mqa_cure_all_decision_tooltip:0 "Cura todas las enfermedades de todo tu reino, y las heridas y discapacidades tuyas, de tus cónyuges, hijos y nietos."
 mqa_cure_all_decision_ct:0 "Le roi te touche, Dieu te guérit"
 mqa_cure_inbred_decision_title:0 "#EMP Monarque Absolu:#! Purificar el linaje"
 mqa_cure_inbred_decision_desc:0 "Libra a tus parientes más cercanos de todo defecto hereditario."
 mqa_cure_inbred_decision_tooltip:0 "Elimina todos los rasgos genéticos negativos, incluidos los ocultos, de ti, tus cónyuges, hijos y nietos."
 mqa_cure_inbred_decision_ct:0 "Bon sang ne saurait mentir"

 # Building decisions
 mqa_b_show_decision_title:0 "--= #EMP Monarque Absolu:#! Mostrar los poderes del constructor =--"
 mqa_b_show_decision_desc:0 "Muestra las decisiones de construcción de Monarque Absolu."
 mqa_b_show_decision_tooltip:0 ""
 mqa_b_show_decision_ct:0 "Qu'on les montre"
 mqa_b_hide_decision_title:0 "--= #EMP Monarque Absolu:#! Ocultar los poderes del constructor =--"
 mqa_b_hide_decision_desc:0 "Oculta las decisiones de construcción de Monarque Absolu."
 mqa_b_hide_decision_tooltip:0 ""
 mqa_b_hide_decision_ct:0 "Qu'on les cache"
 mqa_b_max_all_buildings_sub_realm_decision_title:0 "#EMP Monarque Absolu:#! Maestro constructor"
 mqa_b_max_all_buildings_sub_realm_decision_desc:0 "Mejora todos los edificios de tu dominio hasta su nivel máximo, incluidas las ciudades, templos y castillos de tus barones vasallos en tus condados."
 mqa_b_max_all_buildings_sub_realm_decision_tooltip:0 ""
 mqa_b_max_all_buildings_sub_realm_decision_ct:0 "Bâtissons"
 mqa_b_lucky_7_sub_realm_decision_title:0 "#EMP Monarque Absolu:#! Fortificar y armar el dominio"
 mqa_b_lucky_7_sub_realm_decision_desc:0 "Funda templos y ciudades en las baronías vacías de tus condados y luego llena los espacios de construcción de tu dominio, incluidas las posesiones de tus barones vasallos, con los mejores edificios que el juego permite allí: primero la fortificación adecuada al terreno, luego las mayores levas y después el oro. Los edificios más débiles se sustituyen y después todo se mejora al nivel máximo. No se añade ningún espacio, no se necesitan innovaciones."
 mqa_b_lucky_7_sub_realm_decision_tooltip:0 ""
 mqa_b_lucky_7_sub_realm_decision_ct:0 "Aux armes et à l'ouvrage"
 mqa_b_max_domicile_decision_title:0 "#EMP Monarque Absolu:#! La casa de mis sueños"
 mqa_b_max_domicile_decision_desc:0 "Llena todos los espacios libres de tu residencia (campamento, finca, yurta, mansión...), espacios internos incluidos, y mejora cada edificio hasta su nivel máximo. Primero los edificios con bonificaciones militares, luego oro y recursos; las especializaciones se eligen igual."
 mqa_b_max_domicile_decision_tooltip:0 ""
 mqa_b_max_domicile_decision_ct:0 "Rien n'est trop beau pour Versailles"
