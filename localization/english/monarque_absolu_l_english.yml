l_english:
 # Menus
 interaction_mqa_main:0 "Monarque Absolu"
 decision_group_type_mqa:0 "--= Monarque Absolu =--"

 # Traits
 trait_mqa_immortality:0 "Mélusine"
 trait_mqa_immortality_desc:0 "Like Mélusine, the undying fairy of legend, this character never looks older than 25, and only steel or poison can end their reign."
 trait_mqa_immortality_character_desc:0 "Like Mélusine, the undying fairy of legend, [ROOT.GetCharacter.GetFirstNameNoTooltip] never looks older than 25, and only steel or poison can end this reign."
 trait_mqa_super:0 "Louis XIV"
 trait_mqa_super_desc:0 "«L'État, c'est moi.» Like the Sun King, this ruler has unmatched skills, endless coffers, iron health and a court that bends to every whim."
 trait_mqa_super_character_desc:0 "«L'État, c'est moi.» Like the Sun King, [ROOT.GetCharacter.GetFirstNameNoTooltip] has unmatched skills, endless coffers, iron health and a court that bends to every whim."
 trait_mqa_super_governor:0 "Colbert"
 trait_mqa_super_governor_desc:0 "Like Colbert, the Sun King's tireless minister, this administrator makes lands prosper, raises buildings overnight and has every vassal pay their due."
 trait_mqa_super_governor_character_desc:0 "Like Colbert, the Sun King's tireless minister, [ROOT.GetCharacter.GetFirstNameNoTooltip] makes lands prosper, raises buildings overnight and has every vassal pay their due."
 trait_mqa_super_general:0 "Napoléon"
 trait_mqa_super_general_desc:0 "Like Napoléon, this commander leads armies that march faster, fight harder and take any fortress in days."
 trait_mqa_super_general_character_desc:0 "Like Napoléon, [ROOT.GetCharacter.GetFirstNameNoTooltip] leads armies that march faster, fight harder and take any fortress in days."

 # Interactions
 mqa_immortal_interaction:0 "Grant Mélusine's gift"
 mqa_immortal_interaction_desc:0 "[recipient.GetShortUINameNoTooltip|U] gets #underline Mélusine#!: no more aging past 25, no more natural death."
 mqa_mortal_interaction:0 "Revoke Mélusine's gift"
 mqa_mortal_interaction_desc:0 "[recipient.GetShortUINameNoTooltip|U] becomes mortal again and will age like everyone else."
 mqa_super_interaction:0 "Make a Louis XIV"
 mqa_super_interaction_desc:0 "[recipient.GetShortUINameNoTooltip|U] gets #underline Louis XIV#!: 100 in every skill, huge income and resources, health, fertility, scheme bonuses and protection, and far higher domain and vassal limits."
 mqa_unsuper_interaction:0 "Revoke Louis XIV"
 mqa_unsuper_interaction_desc:0 "[recipient.GetShortUINameNoTooltip|U] loses every Louis XIV bonus."
 mqa_super_governor_interaction:0 "Make a Colbert"
 mqa_super_governor_interaction_desc:0 "[recipient.GetShortUINameNoTooltip|U] gets #underline Colbert#!: near-instant and free construction, county control and development, bigger levies and taxes, and greater vassal contributions."
 mqa_unsuper_governor_interaction:0 "Revoke Colbert"
 mqa_unsuper_governor_interaction_desc:0 "[recipient.GetShortUINameNoTooltip|U] loses every Colbert bonus."
 mqa_super_general_interaction:0 "Make a Napoléon"
 mqa_super_general_interaction_desc:0 "[recipient.GetShortUINameNoTooltip|U] gets #underline Napoléon#!: overwhelming battle advantage, lightning sieges and marches, endless supply, and stronger men-at-arms and knights."
 mqa_unsuper_general_interaction:0 "Revoke Napoléon"
 mqa_unsuper_general_interaction_desc:0 "[recipient.GetShortUINameNoTooltip|U] loses every Napoléon bonus."
 mqa_all_in_one_interaction:0 "Grant absolute power"
 mqa_all_in_one_interaction_desc:0 "[recipient.GetShortUINameNoTooltip|U] becomes Louis XIV, Colbert and Napoléon at once."
 mqa_unall_in_one_interaction:0 "Strip all powers"
 mqa_unall_in_one_interaction_desc:0 "[recipient.GetShortUINameNoTooltip|U] loses Louis XIV, Colbert and Napoléon."

