l_english:
 # Menus
 interaction_mqa_main:0 "Monarque Absolu"
 decision_group_type_mqa:0 "--= Monarque Absolu =--"

 # Traits
 trait_mqa_immortality:0 "Mélusine"
 trait_mqa_immortality_desc:0 "Like Mélusine, the undying fairy of legend, this character never looks older than 25, and only steel or poison can end their reign."
 trait_mqa_immortality_character_desc:0 "Like Mélusine, the undying fairy of legend, [ROOT.GetCharacter.GetFirstNameNoTooltip] never looks older than 25, and only steel or poison can end this reign."
 trait_mqa_super:0 "Louis XIV"
 trait_mqa_super_desc:0 "«L'État, c'est moi.» Like the Sun King, this ruler has unmatched skills, endless coffers, iron health and a court that bends to every whim."
 trait_mqa_super_character_desc:0 "«L'État, c'est moi.» Like the Sun King, [ROOT.GetCharacter.GetFirstNameNoTooltip] has unmatched skills, endless coffers, iron health and a court that bends to every whim."
 trait_mqa_super_governor:0 "Colbert"
 trait_mqa_super_governor_desc:0 "Like Colbert, the Sun King's tireless minister, this administrator makes lands prosper, raises buildings overnight and has every vassal pay their due."
 trait_mqa_super_governor_character_desc:0 "Like Colbert, the Sun King's tireless minister, [ROOT.GetCharacter.GetFirstNameNoTooltip] makes lands prosper, raises buildings overnight and has every vassal pay their due."
 trait_mqa_super_general:0 "Napoléon"
 trait_mqa_super_general_desc:0 "Like Napoléon, this commander leads armies that march faster, fight harder and take any fortress in days."
 trait_mqa_super_general_character_desc:0 "Like Napoléon, [ROOT.GetCharacter.GetFirstNameNoTooltip] leads armies that march faster, fight harder and take any fortress in days."

 # Interactions
 mqa_immortal_interaction:0 "Grant Mélusine's gift"
 mqa_immortal_interaction_desc:0 "[recipient.GetShortUINameNoTooltip|U] gets #underline Mélusine#!: no more aging past 25, no more natural death."
 mqa_mortal_interaction:0 "Revoke Mélusine's gift"
 mqa_mortal_interaction_desc:0 "[recipient.GetShortUINameNoTooltip|U] becomes mortal again and will age like everyone else."
 mqa_super_interaction:0 "Make a Louis XIV"
 mqa_super_interaction_desc:0 "[recipient.GetShortUINameNoTooltip|U] gets #underline Louis XIV#!: 100 in every skill, huge income and resources, health, fertility, scheme bonuses and protection, and far higher domain and vassal limits."
 mqa_unsuper_interaction:0 "Revoke Louis XIV"
 mqa_unsuper_interaction_desc:0 "[recipient.GetShortUINameNoTooltip|U] loses every Louis XIV bonus."
 mqa_super_governor_interaction:0 "Make a Colbert"
 mqa_super_governor_interaction_desc:0 "[recipient.GetShortUINameNoTooltip|U] gets #underline Colbert#!: near-instant and free construction, county control and development, bigger levies and taxes, and greater vassal contributions."
 mqa_unsuper_governor_interaction:0 "Revoke Colbert"
 mqa_unsuper_governor_interaction_desc:0 "[recipient.GetShortUINameNoTooltip|U] loses every Colbert bonus."
 mqa_super_general_interaction:0 "Make a Napoléon"
 mqa_super_general_interaction_desc:0 "[recipient.GetShortUINameNoTooltip|U] gets #underline Napoléon#!: overwhelming battle advantage, lightning sieges and marches, endless supply, and stronger men-at-arms and knights."
 mqa_unsuper_general_interaction:0 "Revoke Napoléon"
 mqa_unsuper_general_interaction_desc:0 "[recipient.GetShortUINameNoTooltip|U] loses every Napoléon bonus."
 mqa_all_in_one_interaction:0 "Grant absolute power"
 mqa_all_in_one_interaction_desc:0 "[recipient.GetShortUINameNoTooltip|U] becomes Louis XIV, Colbert and Napoléon at once."
 mqa_unall_in_one_interaction:0 "Strip all powers"
 mqa_unall_in_one_interaction_desc:0 "[recipient.GetShortUINameNoTooltip|U] loses Louis XIV, Colbert and Napoléon."
 mqa_perfect_bloodline_interaction:0 "Perfect bloodline"
 mqa_perfect_bloodline_interaction_desc:0 "[recipient.GetShortUINameNoTooltip|U] gets the best hereditary traits (#EMP Beautiful, Genius, Divine, Fecund#!) and loses every genetic flaw. [recipient.GetHerHis|U] biological children will be born with the same advantages and pass them on in turn."
 mqa_unperfect_bloodline_interaction:0 "End perfect bloodline"
 mqa_unperfect_bloodline_interaction_desc:0 "[recipient.GetShortUINameNoTooltip|U] keeps [recipient.GetHerHis] current traits, but will no longer pass the perfect bloodline to future children."
 mqa_max_education_interaction:0 "Perfect education"
 mqa_max_education_interaction_desc:0 "[recipient.GetShortUINameNoTooltip|U]'s education trait rises to the highest level of its track."
 mqa_lifestyle_xp_interaction:0 "A lifetime of experience"
 mqa_lifestyle_xp_interaction_desc:0 "[recipient.GetShortUINameNoTooltip|U] gains enough experience in every lifestyle to unlock all of its perks."
 mqa_take_title_interaction:0 "Seize a title"
 mqa_take_title_interaction_desc:0 "Seize one of [recipient.GetShortUINameNoTooltip]'s titles, landless and administrative titles included."
 mqa_take_title_and_vassals_interaction:0 "Seize the title and its vassals"
 mqa_take_landless_title_interaction:0 "Seize a landless title"
 mqa_take_realm_interaction:0 "Seize domain or realm"
 mqa_take_realm_interaction_desc:0 "Seize every title [recipient.GetShortUINameNoTooltip] holds at once, or [recipient.GetHerHis] whole realm with the titles of [recipient.GetHerHis] vassals."
 mqa_take_domain_interaction:0 "Seize the domain"
 mqa_take_domain_as_vassal_interaction:0 "Seize the domain and serve their liege"
 mqa_take_realm_as_vassal_interaction:0 "Seize the realm and serve their liege"

 # Decisions
 mqa_show_decision_title:0 "--= #EMP Monarque Absolu:#! Show the powers =--"
 mqa_show_decision_desc:0 "Show the Monarque Absolu decisions."
 mqa_show_decision_tooltip:0 ""
 mqa_show_decision_ct:0 "Qu'on les montre"
 mqa_hide_decision_title:0 "--= #EMP Monarque Absolu:#! Hide the powers =--"
 mqa_hide_decision_desc:0 "Hide the Monarque Absolu decisions."
 mqa_hide_decision_tooltip:0 ""
 mqa_hide_decision_ct:0 "Qu'on les cache"
 mqa_money_decision_title:0 "#EMP Monarque Absolu:#! Fill the coffers"
 mqa_money_decision_desc:0 "+100k gold, piety, prestige and renown, plus every other resource you use: legitimacy, influence, merit, treasury, court grandeur, spiritual fulfillment, herd or provisions."
 mqa_money_decision_tooltip:0 "+100k gold, piety, prestige and renown, plus every other resource you use: legitimacy, influence, merit, treasury, court grandeur, spiritual fulfillment, herd or provisions."
 mqa_money_decision_ct:0 "L'État, c'est moi"
 mqa_subrealm_to_culture_decision_title:0 "#EMP Monarque Absolu:#! One realm, one culture"
 mqa_subrealm_to_culture_decision_desc:0 "Convert your sub-realm, your vassals, your family and your house to your culture."
 mqa_subrealm_to_culture_decision_tooltip:0 "Convert your sub-realm, your vassals, your family and your house to your culture."
 mqa_subrealm_to_culture_decision_ct:0 "Ainsi soit-il"
 mqa_convert_subrealm_to_religion_decision_title:0 "#EMP Monarque Absolu:#! One realm, one faith"
 mqa_convert_subrealm_to_religion_decision_desc:0 "Convert your sub-realm, your vassals, your family and your house to your faith."
 mqa_convert_subrealm_to_religion_decision_tooltip:0 "Convert your sub-realm, your vassals, your family and your house to your faith."
 mqa_convert_subrealm_to_religion_decision_ct:0 "Un roi, une foi, une loi"
 mqa_cure_pox_decision_title:0 "#EMP Monarque Absolu:#! Banish disease"
 mqa_cure_pox_decision_desc:0 "Every illness in the realm is cured at once."
 mqa_cure_pox_decision_tooltip:0 "Cure every disease in your whole realm: you, your family and house, your court and all your vassals."
 mqa_cure_pox_decision_ct:0 "Le roi te touche, Dieu te guérit"
 mqa_cure_all_decision_title:0 "#EMP Monarque Absolu:#! Mend body and realm"
 mqa_cure_all_decision_desc:0 "Cure every illness in the realm, and the wounds and infirmities of your closest kin."
 mqa_cure_all_decision_tooltip:0 "Cure every disease in your whole realm, and the wounds and disabilities of you, your spouses, children and grandchildren."
 mqa_cure_all_decision_ct:0 "Le roi te touche, Dieu te guérit"
 mqa_cure_inbred_decision_title:0 "#EMP Monarque Absolu:#! Purify the bloodline"
 mqa_cure_inbred_decision_desc:0 "Rid your closest kin of every hereditary flaw."
 mqa_cure_inbred_decision_tooltip:0 "Remove every negative genetic trait, hidden ones included, from you, your spouses, children and grandchildren."
 mqa_cure_inbred_decision_ct:0 "Bon sang ne saurait mentir"
