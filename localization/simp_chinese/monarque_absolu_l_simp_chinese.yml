l_simp_chinese:
 # Menus
 interaction_mqa_main:0 "Monarque Absolu"
 decision_group_type_mqa:0 "--= Monarque Absolu =--"

 # Traits
 trait_mqa_immortality:0 "Mélusine"
 trait_mqa_immortality_desc:0 "如同传说中不朽的仙女Mélusine，此人容貌永远停留在25岁，唯有刀剑或毒药才能终结其统治。"
 trait_mqa_immortality_character_desc:0 "如同传说中不朽的仙女Mélusine，[ROOT.GetCharacter.GetFirstNameNoTooltip]的容貌永远停留在25岁，唯有刀剑或毒药才能终结其统治。"
 trait_mqa_super:0 "Louis XIV"
 trait_mqa_super_desc:0 "“L'État, c'est moi.（朕即国家）”如同太阳王，这位君主拥有无与伦比的能力、取之不尽的财富、钢铁般的健康，以及对每个念头都俯首帖耳的宫廷。"
 trait_mqa_super_character_desc:0 "“L'État, c'est moi.（朕即国家）”如同太阳王，[ROOT.GetCharacter.GetFirstNameNoTooltip]拥有无与伦比的能力、取之不尽的财富、钢铁般的健康，以及对每个念头都俯首帖耳的宫廷。"
 trait_mqa_super_governor:0 "Colbert"
 trait_mqa_super_governor_desc:0 "如同太阳王不知疲倦的大臣Colbert，这位治臣让土地繁荣昌盛，建筑一夜拔地而起，每位封臣都如数缴纳应尽之责。"
 trait_mqa_super_governor_character_desc:0 "如同太阳王不知疲倦的大臣Colbert，[ROOT.GetCharacter.GetFirstNameNoTooltip]让土地繁荣昌盛，建筑一夜拔地而起，每位封臣都如数缴纳应尽之责。"
 trait_mqa_super_general:0 "Napoléon"
 trait_mqa_super_general_desc:0 "如同Napoléon，这位统帅麾下的军队行军更快、作战更猛，数日之内便能攻克任何要塞。"
 trait_mqa_super_general_character_desc:0 "如同Napoléon，[ROOT.GetCharacter.GetFirstNameNoTooltip]麾下的军队行军更快、作战更猛，数日之内便能攻克任何要塞。"

 # Interactions
 mqa_immortal_interaction:0 "赐予Mélusine的恩赐"
 mqa_immortal_interaction_desc:0 "[recipient.GetShortUINameNoTooltip|U]获得#underline Mélusine#!：过了25岁便不再衰老，也不会自然死亡。"
 mqa_mortal_interaction:0 "收回Mélusine的恩赐"
 mqa_mortal_interaction_desc:0 "[recipient.GetShortUINameNoTooltip|U]重新成为凡人，将与众人一样老去。"
 mqa_super_interaction:0 "立为Louis XIV"
 mqa_super_interaction_desc:0 "[recipient.GetShortUINameNoTooltip|U]获得#underline Louis XIV#!：全部能力值100、巨额收入与资源、健康、生育力、计谋加成与防护，以及大幅提高的领地与封臣上限。"
 mqa_unsuper_interaction:0 "收回Louis XIV"
 mqa_unsuper_interaction_desc:0 "[recipient.GetShortUINameNoTooltip|U]将失去所有Louis XIV加成。"
 mqa_super_governor_interaction:0 "立为Colbert"
 mqa_super_governor_interaction_desc:0 "[recipient.GetShortUINameNoTooltip|U]获得#underline Colbert#!：几乎即时且免费的建造、伯国的控制力与发展度、更多的征召兵与税收，以及更多的封臣贡献。"
 mqa_unsuper_governor_interaction:0 "收回Colbert"
 mqa_unsuper_governor_interaction_desc:0 "[recipient.GetShortUINameNoTooltip|U]将失去所有Colbert加成。"
 mqa_super_general_interaction:0 "立为Napoléon"
 mqa_super_general_interaction_desc:0 "[recipient.GetShortUINameNoTooltip|U]获得#underline Napoléon#!：压倒性的战斗优势、闪电般的围城与行军、源源不断的补给，以及更强的常备军与骑士。"
 mqa_unsuper_general_interaction:0 "收回Napoléon"
 mqa_unsuper_general_interaction_desc:0 "[recipient.GetShortUINameNoTooltip|U]将失去所有Napoléon加成。"
 mqa_all_in_one_interaction:0 "赐予绝对权力"
 mqa_all_in_one_interaction_desc:0 "[recipient.GetShortUINameNoTooltip|U]将同时成为Louis XIV、Colbert和Napoléon。"
 mqa_unall_in_one_interaction:0 "收回所有权能"
 mqa_unall_in_one_interaction_desc:0 "[recipient.GetShortUINameNoTooltip|U]将失去Louis XIV、Colbert和Napoléon。"
 mqa_perfect_bloodline_interaction:0 "完美血统"
 mqa_perfect_bloodline_interaction_desc:0 "[recipient.GetShortUINameNoTooltip|U]将获得最好的遗传特质（#EMP 倾国倾城、天才、宛若天神、多产#!），并失去所有遗传缺陷。亲生子女出生时将拥有同样的优势，并继续传给下一代。"
 mqa_unperfect_bloodline_interaction:0 "终止完美血统"
 mqa_unperfect_bloodline_interaction_desc:0 "[recipient.GetShortUINameNoTooltip|U]保留当前特质，但不再将完美血统传给未来的子女。"
 mqa_max_education_interaction:0 "完美教育"
 mqa_max_education_interaction_desc:0 "[recipient.GetShortUINameNoTooltip]的教育特质将提升至该系列的最高等级。"
 mqa_all_perks_interaction:0 "全部天赋"
 mqa_all_perks_interaction_desc:0 "[recipient.GetShortUINameNoTooltip|U]将一次性解锁所有生活方式的全部天赋，以及每棵天赋树顶端的特质。"
 mqa_take_title_interaction:0 "夺取头衔"
 mqa_take_title_interaction_desc:0 "夺取[recipient.GetShortUINameNoTooltip]的一个头衔，包括无地头衔和行政头衔。"
 mqa_take_title_and_vassals_interaction:0 "连同封臣一起夺取头衔"
 mqa_take_landless_title_interaction:0 "夺取无地头衔"
 mqa_take_realm_interaction:0 "夺取领地或国度"
 mqa_take_realm_interaction_desc:0 "一次性夺取[recipient.GetShortUINameNoTooltip]的所有头衔，或连同其封臣的头衔夺取整个国度。"
 mqa_take_domain_interaction:0 "夺取领地"
 mqa_take_domain_as_vassal_interaction:0 "夺取领地并效忠其领主"
 mqa_take_realm_as_vassal_interaction:0 "夺取国度并效忠其领主"

