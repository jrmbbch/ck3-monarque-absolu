l_simp_chinese:
 # Menus
 interaction_mqa_main:0 "Monarque Absolu"
 decision_group_type_mqa:0 "--= Monarque Absolu =--"

 # Traits
 trait_mqa_immortality:0 "Mélusine"
 trait_mqa_immortality_desc:0 "如同传说中不朽的仙女Mélusine，此人容貌永远停留在25岁，唯有刀剑或毒药才能终结其统治。"
 trait_mqa_immortality_character_desc:0 "如同传说中不朽的仙女Mélusine，[ROOT.GetCharacter.GetFirstNameNoTooltip]的容貌永远停留在25岁，唯有刀剑或毒药才能终结其统治。"
 trait_mqa_super:0 "Louis XIV"
 trait_mqa_super_desc:0 "“L'État, c'est moi.（朕即国家）”如同太阳王，这位君主拥有无与伦比的能力、取之不尽的财富、钢铁般的健康，以及对每个念头都俯首帖耳的宫廷。"
 trait_mqa_super_character_desc:0 "“L'État, c'est moi.（朕即国家）”如同太阳王，[ROOT.GetCharacter.GetFirstNameNoTooltip]拥有无与伦比的能力、取之不尽的财富、钢铁般的健康，以及对每个念头都俯首帖耳的宫廷。"
 trait_mqa_super_governor:0 "Colbert"
 trait_mqa_super_governor_desc:0 "如同太阳王不知疲倦的大臣Colbert，这位治臣让土地繁荣昌盛，建筑一夜拔地而起，每位封臣都如数缴纳应尽之责。"
 trait_mqa_super_governor_character_desc:0 "如同太阳王不知疲倦的大臣Colbert，[ROOT.GetCharacter.GetFirstNameNoTooltip]让土地繁荣昌盛，建筑一夜拔地而起，每位封臣都如数缴纳应尽之责。"
 trait_mqa_super_general:0 "Napoléon"
 trait_mqa_super_general_desc:0 "如同Napoléon，这位统帅麾下的军队行军更快、作战更猛，数日之内便能攻克任何要塞。"
 trait_mqa_super_general_character_desc:0 "如同Napoléon，[ROOT.GetCharacter.GetFirstNameNoTooltip]麾下的军队行军更快、作战更猛，数日之内便能攻克任何要塞。"

 # Interactions
 mqa_immortal_interaction:0 "赐予Mélusine的恩赐"
 mqa_immortal_interaction_desc:0 "[recipient.GetShortUINameNoTooltip|U]获得#underline Mélusine#!：过了25岁便不再衰老，也不会自然死亡。"
 mqa_mortal_interaction:0 "收回Mélusine的恩赐"
 mqa_mortal_interaction_desc:0 "[recipient.GetShortUINameNoTooltip|U]重新成为凡人，将与众人一样老去。"
 mqa_super_interaction:0 "立为Louis XIV"
 mqa_super_interaction_desc:0 "[recipient.GetShortUINameNoTooltip|U]获得#underline Louis XIV#!：全部能力值100、巨额收入与资源、健康、生育力、计谋加成与防护，以及大幅提高的领地与封臣上限。"
 mqa_unsuper_interaction:0 "收回Louis XIV"
 mqa_unsuper_interaction_desc:0 "[recipient.GetShortUINameNoTooltip|U]将失去所有Louis XIV加成。"
 mqa_super_governor_interaction:0 "立为Colbert"
 mqa_super_governor_interaction_desc:0 "[recipient.GetShortUINameNoTooltip|U]获得#underline Colbert#!：几乎即时且免费的建造、伯国的控制力与发展度、更多的征召兵与税收，以及更多的封臣贡献。"
 mqa_unsuper_governor_interaction:0 "收回Colbert"
 mqa_unsuper_governor_interaction_desc:0 "[recipient.GetShortUINameNoTooltip|U]将失去所有Colbert加成。"
 mqa_super_general_interaction:0 "立为Napoléon"
 mqa_super_general_interaction_desc:0 "[recipient.GetShortUINameNoTooltip|U]获得#underline Napoléon#!：压倒性的战斗优势、闪电般的围城与行军、源源不断的补给，以及更强的常备军与骑士。"
 mqa_unsuper_general_interaction:0 "收回Napoléon"
 mqa_unsuper_general_interaction_desc:0 "[recipient.GetShortUINameNoTooltip|U]将失去所有Napoléon加成。"
 mqa_all_in_one_interaction:0 "赐予绝对权力"
 mqa_all_in_one_interaction_desc:0 "[recipient.GetShortUINameNoTooltip|U]将同时成为Louis XIV、Colbert和Napoléon。"
 mqa_unall_in_one_interaction:0 "收回所有权能"
 mqa_unall_in_one_interaction_desc:0 "[recipient.GetShortUINameNoTooltip|U]将失去Louis XIV、Colbert和Napoléon。"
 mqa_perfect_bloodline_interaction:0 "完美血统"
 mqa_perfect_bloodline_interaction_desc:0 "[recipient.GetShortUINameNoTooltip|U]将获得最好的遗传特质（#EMP 倾国倾城、天才、宛若天神、多产#!），并失去所有遗传缺陷。亲生子女出生时将拥有同样的优势，并继续传给下一代。"
 mqa_unperfect_bloodline_interaction:0 "终止完美血统"
 mqa_unperfect_bloodline_interaction_desc:0 "[recipient.GetShortUINameNoTooltip|U]保留当前特质，但不再将完美血统传给未来的子女。"
 mqa_max_education_interaction:0 "完美教育"
 mqa_max_education_interaction_desc:0 "[recipient.GetShortUINameNoTooltip]的教育特质将提升至该系列的最高等级。"
 mqa_all_perks_interaction:0 "全部天赋"
 mqa_all_perks_interaction_desc:0 "[recipient.GetShortUINameNoTooltip|U]将一次性解锁所有生活方式的全部天赋，以及每棵天赋树顶端的特质。"
 mqa_take_title_interaction:0 "夺取头衔"
 mqa_take_title_interaction_desc:0 "夺取[recipient.GetShortUINameNoTooltip]的一个头衔，包括无地头衔和行政头衔：可单独夺取，或连同在其之下拥有领地的封臣一起夺取。"
 mqa_take_title_only_option:0 "仅头衔：若原领主等级仍高于封臣，封臣留在其麾下"
 mqa_take_title_and_vassals_option:0 "头衔及其封臣：他们向你宣誓效忠"
 mqa_take_realm_interaction:0 "夺取其所有头衔"
 mqa_take_realm_interaction_desc:0 "一次性夺取[recipient.GetShortUINameNoTooltip]持有的所有头衔，或夺取其整个国度的所有头衔，包括其封臣的伯国和公国。"
 mqa_take_domain_option:0 "其领地：封臣向你宣誓效忠"
 mqa_take_realm_option:0 "其整个国度：封臣失去其伯国和公国"
 mqa_claim_realm_interaction:0 "获得其所有领地的宣称"
 mqa_claim_realm_interaction_desc:0 "获得对[recipient.GetShortUINameNoTooltip]所持头衔或其领国内所有头衔的强宣称，包括其封臣的头衔。头衔持有者和封臣的领主保持不变。"
 mqa_claim_domain_option:0 "其直辖领地：仅宣称其亲自持有的头衔"
 mqa_claim_realm_option:0 "其整个领国：宣称其本人及所有封臣的头衔"

 # Decisions
 mqa_show_decision_title:0 "--= #EMP Monarque Absolu：#! 显示权能 =--"
 mqa_show_decision_desc:0 "显示Monarque Absolu的决议。"
 mqa_show_decision_tooltip:0 ""
 mqa_show_decision_ct:0 "Qu'on les montre"
 mqa_hide_decision_title:0 "--= #EMP Monarque Absolu：#! 隐藏权能 =--"
 mqa_hide_decision_desc:0 "隐藏Monarque Absolu的决议。"
 mqa_hide_decision_tooltip:0 ""
 mqa_hide_decision_ct:0 "Qu'on les cache"
 mqa_money_decision_title:0 "#EMP Monarque Absolu：#! 充盈国库"
 mqa_money_decision_desc:0 "金钱、虔诚、威望和宗族威望+100,000，以及你使用的所有其他资源：正统性、影响力、功绩、国库、宫廷威仪、精神满足、畜群或补给。"
 mqa_money_decision_tooltip:0 "金钱、虔诚、威望和宗族威望+100,000，以及你使用的所有其他资源：正统性、影响力、功绩、国库、宫廷威仪、精神满足、畜群或补给。"
 mqa_money_decision_ct:0 "L'État, c'est moi"
 mqa_subrealm_to_culture_decision_title:0 "#EMP Monarque Absolu：#! 一国一文化"
 mqa_subrealm_to_culture_decision_desc:0 "将你的下属领域、封臣、家人和家族转变为你的文化。"
 mqa_subrealm_to_culture_decision_tooltip:0 "将你的下属领域、封臣、家人和家族转变为你的文化。"
 mqa_subrealm_to_culture_decision_ct:0 "Ainsi soit-il"
 mqa_convert_subrealm_to_religion_decision_title:0 "#EMP Monarque Absolu：#! 一国一信仰"
 mqa_convert_subrealm_to_religion_decision_desc:0 "将你的下属领域、封臣、家人和家族皈依你的信仰与礼仪。"
 mqa_convert_subrealm_to_religion_decision_tooltip:0 "将你的下属领域、封臣、家人和家族皈依你的信仰与礼仪。"
 mqa_convert_subrealm_to_religion_decision_ct:0 "Un roi, une foi, une loi"
 mqa_gather_realm_decision_title:0 "#EMP Monarque Absolu：#! 统合王国"
 mqa_gather_realm_decision_desc:0 "不经战争收回所有在法理上属于你的公国、王国和帝国、却由你的国度之外的人持有的伯国、公国和王国。伯国连同其男爵一并转移。你的头衔之外的一切不受影响，你自己的封臣保有其领地。"
 mqa_gather_realm_decision_tooltip:0 ""
 mqa_gather_realm_decision_ct:0 "Montjoie ! Saint-Denis !"
 mqa_gather_realm_decision_effect_tt:0 "所有法理上属于你的公国、王国和帝国、由外国统治者持有的伯国、公国和王国都归你所有。"
 mqa_council_on_decision_title:0 "#EMP Monarque Absolu：#! 非凡的议会"
 mqa_council_on_decision_desc:0 "你的每位议员在其职位技能上获得+100：大臣为外交，元帅为军事，管家为管理，间谍总管为谋略，宫廷祭司为学识，行政大臣亦包括在内。新议员在一个月内获得；离开议会者则失去。"
 mqa_council_on_decision_tooltip:0 ""
 mqa_council_on_decision_ct:0 "Le Roi en son Conseil"
 mqa_council_on_decision_effect_tt:0 "你的议员在任职期间，其职位技能获得+100。"
 mqa_council_off_decision_title:0 "#EMP Monarque Absolu：#! 寻常的议会"
 mqa_council_off_decision_desc:0 "你的议员失去非凡议会的加成。"
 mqa_council_off_decision_tooltip:0 ""
 mqa_council_off_decision_ct:0 "Le Conseil est levé"
 mqa_council_off_decision_effect_tt:0 "你的议员失去+100加成。"
 mqa_council_diplomacy_modifier:0 "非凡的议会：外交"
 mqa_council_diplomacy_modifier_desc:0 "君主赐予的议会职位技能+100。"
 mqa_council_martial_modifier:0 "非凡的议会：军事"
 mqa_council_martial_modifier_desc:0 "君主赐予的议会职位技能+100。"
 mqa_council_stewardship_modifier:0 "非凡的议会：管理"
 mqa_council_stewardship_modifier_desc:0 "君主赐予的议会职位技能+100。"
 mqa_council_intrigue_modifier:0 "非凡的议会：谋略"
 mqa_council_intrigue_modifier_desc:0 "君主赐予的议会职位技能+100。"
 mqa_council_learning_modifier:0 "非凡的议会：学识"
 mqa_council_learning_modifier_desc:0 "君主赐予的议会职位技能+100。"
 mqa_cure_all_decision_title:0 "#EMP Monarque Absolu：#! 疗愈身体与国度"
 mqa_cure_all_decision_desc:0 "治愈国度中的所有疾病，以及你最亲近家人的伤势与残疾。"
 mqa_cure_all_decision_tooltip:0 "治愈你整个国度中的所有疾病，以及你、你的配偶、子女和孙辈的伤势与残疾。"
 mqa_cure_all_decision_ct:0 "Le roi te touche, Dieu te guérit"
 mqa_cure_inbred_decision_title:0 "#EMP Monarque Absolu：#! 净化血统"
 mqa_cure_inbred_decision_desc:0 "让你最亲近的家人摆脱一切遗传缺陷。"
 mqa_cure_inbred_decision_tooltip:0 "移除你、你的配偶、子女和孙辈身上所有负面遗传特质，包括隐性的。"
 mqa_cure_inbred_decision_ct:0 "Bon sang ne saurait mentir"

 # Building decisions
 mqa_b_show_decision_title:0 "--= #EMP Monarque Absolu：#! 显示建造者权能 =--"
 mqa_b_show_decision_desc:0 "显示Monarque Absolu的建筑决议。"
 mqa_b_show_decision_tooltip:0 ""
 mqa_b_show_decision_ct:0 "Qu'on les montre"
 mqa_b_hide_decision_title:0 "--= #EMP Monarque Absolu：#! 隐藏建造者权能 =--"
 mqa_b_hide_decision_desc:0 "隐藏Monarque Absolu的建筑决议。"
 mqa_b_hide_decision_tooltip:0 ""
 mqa_b_hide_decision_ct:0 "Qu'on les cache"
 mqa_b_lucky_7_sub_realm_decision_title:0 "#EMP Monarque Absolu：#! 加固并武装领地"
 mqa_b_lucky_7_sub_realm_decision_desc:0 "若你的政体既非部落制也非草原政体，你直辖领地内的部落与游牧领地会先变为城堡。 在你伯国内的空男爵领建立神殿和城市，然后用游戏允许的最佳建筑填满你直辖领地（包括封臣男爵的地产）的建筑槽位：首先是适合地形的防御工事，其次是征召兵最多的建筑，然后是金钱。较弱的建筑会被替换，随后在游戏允许的范围内全部升级。只建造你亲自能建造的建筑：革新与领地等级均适用。不会增加槽位。"
 mqa_b_lucky_7_sub_realm_decision_tooltip:0 ""
 mqa_b_lucky_7_sub_realm_decision_ct:0 "Aux armes et à l'ouvrage"
 mqa_b_ongoing_constructions_warning:0 "@warning_icon! #warning 你领地内正在进行的建造：[GetPlayer.MakeScope.ScriptValue('mqa_b_ongoing_constructions_value')|0]。此决议无法取消它们，它们会继续占用槽位：请先亲自取消，以便填满该槽位。#!"
 mqa_b_max_domicile_decision_title:0 "#EMP Monarque Absolu：#! 梦想之家"
 mqa_b_max_domicile_decision_desc:0 "填满你住所（营地、庄园、毡帐、宅邸等）的所有空槽位（包括内部槽位），并在游戏允许的范围内升级每座建筑。只建造你亲自能建造的建筑。带军事加成的建筑优先，其次是金钱与资源；专精也按同样方式选择。 住所中正在进行的建造会先被取消并退款，如同你亲自取消一样。"
 mqa_b_max_domicile_decision_tooltip:0 ""
 mqa_b_max_domicile_decision_ct:0 "Rien n'est trop beau pour Versailles"
