 mqa_subrealm_to_culture_decision_desc:0 "将你的下属领域、封臣、家人和家族转变为你的文化。"
 mqa_subrealm_to_culture_decision_tooltip:0 "将你的下属领域、封臣、家人和家族转变为你的文化。"
 mqa_subrealm_to_culture_decision_ct:0 "Ainsi soit-il"
 mqa_convert_subrealm_to_religion_decision_title:0 "#EMP Monarque Absolu：#! 一国一信仰"
 mqa_convert_subrealm_to_religion_decision_desc:0 "将你的下属领域、封臣、家人和家族皈依你的信仰。"
 mqa_convert_subrealm_to_religion_decision_tooltip:0 "将你的下属领域、封臣、家人和家族皈依你的信仰。"
 mqa_convert_subrealm_to_religion_decision_ct:0 "Un roi, une foi, une loi"
 mqa_cure_pox_decision_title:0 "#EMP Monarque Absolu：#! 驱除疾病"
