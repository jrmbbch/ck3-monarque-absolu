 mqa_b_lucky_7_sub_realm_decision_title:0 "#EMP Monarque Absolu：#! 加固并武装领地"
 mqa_b_lucky_7_sub_realm_decision_desc:0 "在你伯国内的空男爵领建立神殿和城市，然后用游戏允许的最佳建筑填满你直辖领地（包括封臣男爵的地产）的建筑槽位：首先是适合地形的防御工事，其次是征召兵最多的建筑，然后是金钱。较弱的建筑会被替换，随后全部升级到最高等级。不会增加槽位，无需革新。"
 mqa_b_lucky_7_sub_realm_decision_tooltip:0 ""
 mqa_b_lucky_7_sub_realm_decision_ct:0 "Aux armes et à l'ouvrage"
 mqa_b_max_domicile_decision_title:0 "#EMP Monarque Absolu：#! 梦想之家"
 mqa_b_max_domicile_decision_desc:0 "填满你住所（营地、庄园、毡帐、宅邸等）的所有空槽位（包括内部槽位），并将每座建筑升级到最高等级。带军事加成的建筑优先，其次是金钱与资源；专精也按同样方式选择。"
 mqa_b_max_domicile_decision_tooltip:0 ""
 mqa_b_max_domicile_decision_ct:0 "Rien n'est trop beau pour Versailles"
