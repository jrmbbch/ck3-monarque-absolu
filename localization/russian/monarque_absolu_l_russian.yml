l_russian:
 # Menus
 interaction_mqa_main:0 "Monarque Absolu"
 decision_group_type_mqa:0 "--= Monarque Absolu =--"

 # Traits
 trait_mqa_immortality:0 "Mélusine"
 trait_mqa_immortality_desc:0 "Подобно Mélusine, бессмертной фее из легенд, этот персонаж никогда не будет выглядеть старше 25 лет, и лишь сталь или яд могут прервать его правление."
 trait_mqa_immortality_character_desc:0 "Подобно Mélusine, бессмертной фее из легенд, [ROOT.GetCharacter.GetFirstNameNoTooltip] никогда не будет выглядеть старше 25 лет, и лишь сталь или яд могут прервать это правление."
 trait_mqa_super:0 "Louis XIV"
 trait_mqa_super_desc:0 "«L'État, c'est moi.» Подобно Королю-Солнце, этот правитель обладает непревзойдёнными навыками, бездонной казной, железным здоровьем и двором, послушным любой прихоти."
 trait_mqa_super_character_desc:0 "«L'État, c'est moi.» Подобно Королю-Солнце, [ROOT.GetCharacter.GetFirstNameNoTooltip] обладает непревзойдёнными навыками, бездонной казной, железным здоровьем и двором, послушным любой прихоти."
 trait_mqa_super_governor:0 "Colbert"
 trait_mqa_super_governor_desc:0 "Подобно Colbert, неутомимому министру Короля-Солнце, этот управитель заставляет земли процветать, здания — вырастать за ночь, а каждого вассала — платить сполна."
 trait_mqa_super_governor_character_desc:0 "Подобно Colbert, неутомимому министру Короля-Солнце, [ROOT.GetCharacter.GetFirstNameNoTooltip] заставляет земли процветать, здания — вырастать за ночь, а каждого вассала — платить сполна."
 trait_mqa_super_general:0 "Napoléon"
 trait_mqa_super_general_desc:0 "Подобно Napoléon, этот полководец ведёт армии, которые маршируют быстрее, бьют сильнее и берут любую крепость за считаные дни."
 trait_mqa_super_general_character_desc:0 "Подобно Napoléon, [ROOT.GetCharacter.GetFirstNameNoTooltip] ведёт армии, которые маршируют быстрее, бьют сильнее и берут любую крепость за считаные дни."

 # Interactions
 mqa_immortal_interaction:0 "Даровать дар Mélusine"
 mqa_immortal_interaction_desc:0 "[recipient.GetShortUINameNoTooltip|U] получает #underline Mélusine#!: больше не стареет после 25 лет и не умирает естественной смертью."
 mqa_mortal_interaction:0 "Отнять дар Mélusine"
 mqa_mortal_interaction_desc:0 "[recipient.GetShortUINameNoTooltip|U] снова смертен и будет стареть, как все."
 mqa_super_interaction:0 "Сделать Louis XIV"
 mqa_super_interaction_desc:0 "[recipient.GetShortUINameNoTooltip|U] получает #underline Louis XIV#!: 100 во всех навыках, огромные доходы и ресурсы, здоровье, плодовитость, бонусы и защиту от происков, а также гораздо больший предел домена и вассалов."
 mqa_unsuper_interaction:0 "Отнять Louis XIV"
 mqa_unsuper_interaction_desc:0 "[recipient.GetShortUINameNoTooltip|U] теряет все бонусы Louis XIV."
 mqa_super_governor_interaction:0 "Сделать Colbert"
 mqa_super_governor_interaction_desc:0 "[recipient.GetShortUINameNoTooltip|U] получает #underline Colbert#!: почти мгновенное и бесплатное строительство, контроль и развитие графств, большее ополчение и налоги, а также больший вклад вассалов."
 mqa_unsuper_governor_interaction:0 "Отнять Colbert"
 mqa_unsuper_governor_interaction_desc:0 "[recipient.GetShortUINameNoTooltip|U] теряет все бонусы Colbert."
 mqa_super_general_interaction:0 "Сделать Napoléon"
 mqa_super_general_interaction_desc:0 "[recipient.GetShortUINameNoTooltip|U] получает #underline Napoléon#!: подавляющее преимущество в бою, молниеносные осады и марши, неиссякаемое снабжение, а также более сильных латников и рыцарей."
 mqa_unsuper_general_interaction:0 "Отнять Napoléon"
 mqa_unsuper_general_interaction_desc:0 "[recipient.GetShortUINameNoTooltip|U] теряет все бонусы Napoléon."
 mqa_all_in_one_interaction:0 "Даровать абсолютную власть"
 mqa_all_in_one_interaction_desc:0 "[recipient.GetShortUINameNoTooltip|U] получает разом Louis XIV, Colbert и Napoléon."
 mqa_unall_in_one_interaction:0 "Лишить всех сил"
 mqa_unall_in_one_interaction_desc:0 "[recipient.GetShortUINameNoTooltip|U] теряет Louis XIV, Colbert и Napoléon."
 mqa_perfect_bloodline_interaction:0 "Идеальная родословная"
 mqa_perfect_bloodline_interaction_desc:0 "[recipient.GetShortUINameNoTooltip|U] получает лучшие наследственные черты (#EMP Прелесть, Гениальность, Божественная стать, Плодовитость#!) и избавляется от всех генетических изъянов. Родные дети рождаются с теми же преимуществами и передают их дальше."
 mqa_unperfect_bloodline_interaction:0 "Прервать идеальную родословную"
 mqa_unperfect_bloodline_interaction_desc:0 "[recipient.GetShortUINameNoTooltip|U] сохраняет нынешние черты, но больше не передаёт идеальную родословную будущим детям."
 mqa_max_education_interaction:0 "Совершенное образование"
 mqa_max_education_interaction_desc:0 "Черта образования персонажа [recipient.GetShortUINameNoTooltip] поднимается до высшего уровня своей ветви."
 mqa_lifestyle_xp_interaction:0 "Опыт целой жизни"
 mqa_lifestyle_xp_interaction_desc:0 "[recipient.GetShortUINameNoTooltip|U] получает в каждом образе жизни достаточно опыта, чтобы открыть все его преимущества."
 mqa_take_title_interaction:0 "Захватить титул"
 mqa_take_title_interaction_desc:0 "Захватить один из титулов персонажа [recipient.GetShortUINameNoTooltip], включая безземельные и административные титулы."
 mqa_take_title_and_vassals_interaction:0 "Захватить титул вместе с вассалами"
 mqa_take_landless_title_interaction:0 "Захватить безземельный титул"
 mqa_take_realm_interaction:0 "Захватить домен или державу"
 mqa_take_realm_interaction_desc:0 "Захватить разом все титулы персонажа [recipient.GetShortUINameNoTooltip] или всю его державу вместе с титулами вассалов."
 mqa_take_domain_interaction:0 "Захватить домен"
 mqa_take_domain_as_vassal_interaction:0 "Захватить домен и служить его сюзерену"
 mqa_take_realm_as_vassal_interaction:0 "Захватить державу и служить его сюзерену"

 # Decisions
 mqa_show_decision_title:0 "--= #EMP Monarque Absolu:#! Показать силы =--"
 mqa_show_decision_desc:0 "Показать решения Monarque Absolu."
 mqa_show_decision_tooltip:0 ""
 mqa_show_decision_ct:0 "Qu'on les montre"
 mqa_hide_decision_title:0 "--= #EMP Monarque Absolu:#! Скрыть силы =--"
 mqa_hide_decision_desc:0 "Скрыть решения Monarque Absolu."
 mqa_hide_decision_tooltip:0 ""
 mqa_hide_decision_ct:0 "Qu'on les cache"
 mqa_money_decision_title:0 "#EMP Monarque Absolu:#! Наполнить казну"
 mqa_money_decision_desc:0 "+100k золота, благочестия, престижа и признания, а также все остальные ресурсы, которыми вы пользуетесь: легитимность, влияние, заслуги, казна, величие двора, духовная удовлетворённость, стада или припасы."
 mqa_money_decision_tooltip:0 "+100k золота, благочестия, престижа и признания, а также все остальные ресурсы, которыми вы пользуетесь: легитимность, влияние, заслуги, казна, величие двора, духовная удовлетворённость, стада или припасы."
 mqa_money_decision_ct:0 "L'État, c'est moi"
 mqa_subrealm_to_culture_decision_title:0 "#EMP Monarque Absolu:#! Одна держава, одна культура"
 mqa_subrealm_to_culture_decision_desc:0 "Обратить ваши владения, вассалов, семью и дом в вашу культуру."
 mqa_subrealm_to_culture_decision_tooltip:0 "Обратить ваши владения, вассалов, семью и дом в вашу культуру."
 mqa_subrealm_to_culture_decision_ct:0 "Ainsi soit-il"
 mqa_convert_subrealm_to_religion_decision_title:0 "#EMP Monarque Absolu:#! Одна держава, одна вера"
 mqa_convert_subrealm_to_religion_decision_desc:0 "Обратить ваши владения, вассалов, семью и дом в вашу веру."
 mqa_convert_subrealm_to_religion_decision_tooltip:0 "Обратить ваши владения, вассалов, семью и дом в вашу веру."
 mqa_convert_subrealm_to_religion_decision_ct:0 "Un roi, une foi, une loi"
 mqa_cure_pox_decision_title:0 "#EMP Monarque Absolu:#! Изгнать болезни"
 mqa_cure_pox_decision_desc:0 "Все болезни в державе исцеляются разом."
 mqa_cure_pox_decision_tooltip:0 "Вылечить все болезни во всём государстве: вас, вашу семью и дом, ваш двор и всех ваших вассалов."
 mqa_cure_pox_decision_ct:0 "Le roi te touche, Dieu te guérit"
 mqa_cure_all_decision_title:0 "#EMP Monarque Absolu:#! Исцелить тела и державу"
 mqa_cure_all_decision_desc:0 "Исцелить все болезни в державе, а также раны и недуги ваших ближайших родичей."
 mqa_cure_all_decision_tooltip:0 "Вылечить все болезни во всём государстве, а также раны и увечья у вас, ваших супругов, детей и внуков."
 mqa_cure_all_decision_ct:0 "Le roi te touche, Dieu te guérit"
 mqa_cure_inbred_decision_title:0 "#EMP Monarque Absolu:#! Очистить кровь"
 mqa_cure_inbred_decision_desc:0 "Избавить ваших ближайших родичей от всех наследственных изъянов."
 mqa_cure_inbred_decision_tooltip:0 "Убрать все отрицательные генетические черты, включая скрытые, у вас, ваших супругов, детей и внуков."
 mqa_cure_inbred_decision_ct:0 "Bon sang ne saurait mentir"

 # Building decisions
 mqa_b_show_decision_title:0 "--= #EMP Monarque Absolu:#! Показать силы зодчего =--"
 mqa_b_show_decision_desc:0 "Показать строительные решения Monarque Absolu."
 mqa_b_show_decision_tooltip:0 ""
 mqa_b_show_decision_ct:0 "Qu'on les montre"
 mqa_b_hide_decision_title:0 "--= #EMP Monarque Absolu:#! Скрыть силы зодчего =--"
 mqa_b_hide_decision_desc:0 "Скрыть строительные решения Monarque Absolu."
 mqa_b_hide_decision_tooltip:0 ""
 mqa_b_hide_decision_ct:0 "Qu'on les cache"
 mqa_b_max_all_buildings_sub_realm_decision_title:0 "#EMP Monarque Absolu:#! Великий зодчий"
 mqa_b_max_all_buildings_sub_realm_decision_desc:0 "Улучшить все здания вашего домена до максимального уровня, включая города, храмы и замки ваших вассальных баронов в ваших графствах."
 mqa_b_max_all_buildings_sub_realm_decision_tooltip:0 ""
 mqa_b_max_all_buildings_sub_realm_decision_ct:0 "Bâtissons"
 mqa_b_lucky_7_sub_realm_decision_title:0 "#EMP Monarque Absolu:#! Укрепить и вооружить домен"
 mqa_b_lucky_7_sub_realm_decision_desc:0 "Основывает храмы и города в пустых баронствах ваших графств, затем заполняет слоты вашего домена, включая владения ваших вассальных баронов, лучшими зданиями, которые там разрешает игра: сначала укрепление, подходящее для местности, затем самое большое ополчение, затем золото. Более слабые здания заменяются, после чего всё улучшается до максимума. Слоты не добавляются, инновации не нужны."
 mqa_b_lucky_7_sub_realm_decision_tooltip:0 ""
 mqa_b_lucky_7_sub_realm_decision_ct:0 "Aux armes et à l'ouvrage"
 mqa_b_max_domicile_decision_title:0 "#EMP Monarque Absolu:#! Дом мечты"
 mqa_b_max_domicile_decision_desc:0 "Заполняет свободные места вашей резиденции (лагерь, поместье, юрта, усадьба...), сначала постройками с военными бонусами, затем золотом и ресурсами, и улучшает каждую постройку до максимального уровня. Где постройка может специализироваться, выбор остаётся за вами."
 mqa_b_max_domicile_decision_tooltip:0 ""
 mqa_b_max_domicile_decision_ct:0 "Rien n'est trop beau pour Versailles"
