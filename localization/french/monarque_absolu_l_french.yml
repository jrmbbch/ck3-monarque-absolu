l_french:
 # Menus
 interaction_mqa_main:0 "Monarque Absolu"
 decision_group_type_mqa:0 "--= Monarque Absolu =--"

 # Traits
 trait_mqa_immortality:0 "Mélusine"
 trait_mqa_immortality_desc:0 "Comme Mélusine, la fée immortelle de la légende, ce personnage ne paraîtra jamais plus de 25 ans, et seuls le fer ou le poison pourront mettre fin à son règne."
 trait_mqa_immortality_character_desc:0 "Comme Mélusine, la fée immortelle de la légende, [ROOT.GetCharacter.GetFirstNameNoTooltip] ne paraîtra jamais plus de 25 ans, et seuls le fer ou le poison pourront mettre fin à ce règne."
 trait_mqa_super:0 "Louis XIV"
 trait_mqa_super_desc:0 "« L'État, c'est moi. » Comme le Roi-Soleil, ce souverain a des aptitudes inégalées, des coffres sans fond, une santé de fer et une cour qui plie devant chaque caprice."
 trait_mqa_super_character_desc:0 "« L'État, c'est moi. » Comme le Roi-Soleil, [ROOT.GetCharacter.GetFirstNameNoTooltip] a des aptitudes inégalées, des coffres sans fond, une santé de fer et une cour qui plie devant chaque caprice."
 trait_mqa_super_governor:0 "Colbert"
 trait_mqa_super_governor_desc:0 "Comme Colbert, l'infatigable ministre du Roi-Soleil, cet administrateur fait prospérer les terres, sortir les bâtiments de terre en une nuit et payer son dû à chaque vassal."
 trait_mqa_super_governor_character_desc:0 "Comme Colbert, l'infatigable ministre du Roi-Soleil, [ROOT.GetCharacter.GetFirstNameNoTooltip] fait prospérer les terres, sortir les bâtiments de terre en une nuit et payer son dû à chaque vassal."
 trait_mqa_super_general:0 "Napoléon"
 trait_mqa_super_general_desc:0 "Comme Napoléon, ce commandant mène des armées qui marchent plus vite, frappent plus fort et prennent n'importe quelle forteresse en quelques jours."
 trait_mqa_super_general_character_desc:0 "Comme Napoléon, [ROOT.GetCharacter.GetFirstNameNoTooltip] mène des armées qui marchent plus vite, frappent plus fort et prennent n'importe quelle forteresse en quelques jours."

 # Interactions
 mqa_immortal_interaction:0 "Accorder le don de Mélusine"
 mqa_immortal_interaction_desc:0 "[recipient.GetShortUINameNoTooltip|U] obtient #underline Mélusine#! : plus de vieillissement après 25 ans, plus de mort naturelle."
 mqa_mortal_interaction:0 "Retirer le don de Mélusine"
 mqa_mortal_interaction_desc:0 "[recipient.GetShortUINameNoTooltip|U] redevient mortel et vieillira comme tout le monde."
 mqa_super_interaction:0 "Faire un Louis XIV"
 mqa_super_interaction_desc:0 "[recipient.GetShortUINameNoTooltip|U] obtient #underline Louis XIV#! : 100 dans chaque aptitude, d'énormes revenus et ressources, la santé, la fécondité, des bonus et une protection contre les complots, et des limites de domaine et de vassaux bien plus hautes."
 mqa_unsuper_interaction:0 "Retirer Louis XIV"
 mqa_unsuper_interaction_desc:0 "[recipient.GetShortUINameNoTooltip|U] perd tous les bonus de Louis XIV."
 mqa_super_governor_interaction:0 "Faire un Colbert"
 mqa_super_governor_interaction_desc:0 "[recipient.GetShortUINameNoTooltip|U] obtient #underline Colbert#! : des constructions quasi instantanées et gratuites, le contrôle et le développement des comtés, des levées et taxes accrues et de plus fortes contributions des vassaux."
 mqa_unsuper_governor_interaction:0 "Retirer Colbert"
 mqa_unsuper_governor_interaction_desc:0 "[recipient.GetShortUINameNoTooltip|U] perd tous les bonus de Colbert."
 mqa_super_general_interaction:0 "Faire un Napoléon"
 mqa_super_general_interaction_desc:0 "[recipient.GetShortUINameNoTooltip|U] obtient #underline Napoléon#! : un avantage écrasant au combat, des sièges et des marches éclair, un ravitaillement sans fin, et des hommes d'armes et chevaliers plus forts."
 mqa_unsuper_general_interaction:0 "Retirer Napoléon"
 mqa_unsuper_general_interaction_desc:0 "[recipient.GetShortUINameNoTooltip|U] perd tous les bonus de Napoléon."
 mqa_all_in_one_interaction:0 "Accorder le pouvoir absolu"
 mqa_all_in_one_interaction_desc:0 "[recipient.GetShortUINameNoTooltip|U] devient à la fois Louis XIV, Colbert et Napoléon."
 mqa_unall_in_one_interaction:0 "Retirer tous les pouvoirs"
 mqa_unall_in_one_interaction_desc:0 "[recipient.GetShortUINameNoTooltip|U] perd Louis XIV, Colbert et Napoléon."
 mqa_perfect_bloodline_interaction:0 "Lignée parfaite"
 mqa_perfect_bloodline_interaction_desc:0 "[recipient.GetShortUINameNoTooltip|U] obtient les meilleurs traits héréditaires (#EMP Magnifique, Génie, Divin, Fécond#!) et perd toutes ses tares génétiques. Ses enfants biologiques naîtront avec les mêmes avantages et les transmettront à leur tour."
 mqa_unperfect_bloodline_interaction:0 "Arrêter la lignée parfaite"
 mqa_unperfect_bloodline_interaction_desc:0 "[recipient.GetShortUINameNoTooltip|U] conserve ses traits actuels, mais ne transmettra plus la lignée parfaite à ses futurs enfants."
 mqa_max_education_interaction:0 "Éducation parfaite"
 mqa_max_education_interaction_desc:0 "Le trait d'éducation de [recipient.GetShortUINameNoTooltip] monte au plus haut niveau de sa filière."
 mqa_all_perks_interaction:0 "Tous les atouts"
 mqa_all_perks_interaction_desc:0 "[recipient.GetShortUINameNoTooltip|U] débloque d'un coup tous les atouts de tous les styles de vie, ainsi que les traits qui couronnent chaque arbre."
 mqa_take_title_interaction:0 "S'emparer d'un titre"
 mqa_take_title_interaction_desc:0 "S'emparer de l'un des titres de [recipient.GetShortUINameNoTooltip], titres sans terre et administratifs compris."
 mqa_take_title_and_vassals_interaction:0 "S'emparer du titre et de ses vassaux"
 mqa_take_landless_title_interaction:0 "S'emparer d'un titre sans terre"
 mqa_take_realm_interaction:0 "S'emparer du domaine ou du royaume"
 mqa_take_realm_interaction_desc:0 "S'emparer d'un coup de tous les titres de [recipient.GetShortUINameNoTooltip], ou de tout son royaume avec les titres de ses vassaux."
 mqa_take_domain_interaction:0 "S'emparer du domaine"
 mqa_take_domain_as_vassal_interaction:0 "S'emparer du domaine et servir son suzerain"
 mqa_take_realm_as_vassal_interaction:0 "S'emparer du royaume et servir son suzerain"

 # Decisions
 mqa_show_decision_title:0 "--= #EMP Monarque Absolu :#! Afficher les pouvoirs =--"
 mqa_show_decision_desc:0 "Affiche les décisions d'Monarque Absolu."
 mqa_show_decision_tooltip:0 ""
 mqa_show_decision_ct:0 "Qu'on les montre"
 mqa_hide_decision_title:0 "--= #EMP Monarque Absolu :#! Masquer les pouvoirs =--"
 mqa_hide_decision_desc:0 "Masque les décisions d'Monarque Absolu."
 mqa_hide_decision_tooltip:0 ""
 mqa_hide_decision_ct:0 "Qu'on les cache"
 mqa_money_decision_title:0 "#EMP Monarque Absolu :#! Remplir les coffres"
 mqa_money_decision_desc:0 "+100 000 en or, piété, prestige et renommée, plus toutes les autres ressources que vous utilisez : légitimité, influence, mérite, trésor, grandeur de cour, épanouissement spirituel, troupeau ou provisions."
 mqa_money_decision_tooltip:0 "+100 000 en or, piété, prestige et renommée, plus toutes les autres ressources que vous utilisez : légitimité, influence, mérite, trésor, grandeur de cour, épanouissement spirituel, troupeau ou provisions."
 mqa_money_decision_ct:0 "L'État, c'est moi"
 mqa_subrealm_to_culture_decision_title:0 "#EMP Monarque Absolu :#! Un royaume, une culture"
 mqa_subrealm_to_culture_decision_desc:0 "Convertit votre sous-royaume, vos vassaux, votre famille et votre maison à votre culture."
 mqa_subrealm_to_culture_decision_tooltip:0 "Convertit votre sous-royaume, vos vassaux, votre famille et votre maison à votre culture."
 mqa_subrealm_to_culture_decision_ct:0 "Ainsi soit-il"
 mqa_convert_subrealm_to_religion_decision_title:0 "#EMP Monarque Absolu :#! Un royaume, une foi"
 mqa_convert_subrealm_to_religion_decision_desc:0 "Convertit votre sous-royaume, vos vassaux, votre famille et votre maison à votre foi."
 mqa_convert_subrealm_to_religion_decision_tooltip:0 "Convertit votre sous-royaume, vos vassaux, votre famille et votre maison à votre foi."
 mqa_convert_subrealm_to_religion_decision_ct:0 "Un roi, une foi, une loi"
 mqa_cure_pox_decision_title:0 "#EMP Monarque Absolu :#! Chasser la maladie"
 mqa_cure_pox_decision_desc:0 "Toutes les maladies du royaume sont guéries d'un coup."
 mqa_cure_pox_decision_tooltip:0 "Guérit toutes les maladies de votre royaume : vous, votre famille et votre maison, votre cour et tous vos vassaux."
 mqa_cure_pox_decision_ct:0 "Le roi te touche, Dieu te guérit"
 mqa_cure_all_decision_title:0 "#EMP Monarque Absolu :#! Soigner les corps et le royaume"
 mqa_cure_all_decision_desc:0 "Guérit toutes les maladies du royaume, ainsi que les blessures et infirmités de vos plus proches parents."
 mqa_cure_all_decision_tooltip:0 "Guérit toutes les maladies de votre royaume, ainsi que les blessures et handicaps de vous-même, de vos conjoints, enfants et petits-enfants."
 mqa_cure_all_decision_ct:0 "Le roi te touche, Dieu te guérit"
 mqa_cure_inbred_decision_title:0 "#EMP Monarque Absolu :#! Purifier la lignée"
 mqa_cure_inbred_decision_desc:0 "Débarrasse vos plus proches parents de toute tare héréditaire."
 mqa_cure_inbred_decision_tooltip:0 "Retire tous les traits génétiques négatifs, cachés compris, à vous-même, à vos conjoints, enfants et petits-enfants."
 mqa_cure_inbred_decision_ct:0 "Bon sang ne saurait mentir"

 # Building decisions
 mqa_b_show_decision_title:0 "--= #EMP Monarque Absolu :#! Afficher les pouvoirs du bâtisseur =--"
 mqa_b_show_decision_desc:0 "Affiche les décisions de construction d'Monarque Absolu."
 mqa_b_show_decision_tooltip:0 ""
 mqa_b_show_decision_ct:0 "Qu'on les montre"
 mqa_b_hide_decision_title:0 "--= #EMP Monarque Absolu :#! Masquer les pouvoirs du bâtisseur =--"
 mqa_b_hide_decision_desc:0 "Masque les décisions de construction d'Monarque Absolu."
 mqa_b_hide_decision_tooltip:0 ""
 mqa_b_hide_decision_ct:0 "Qu'on les cache"
 mqa_b_max_all_buildings_sub_realm_decision_title:0 "#EMP Monarque Absolu :#! Maître bâtisseur"
 mqa_b_max_all_buildings_sub_realm_decision_desc:0 "Améliore tous les bâtiments de votre domaine jusqu'à leur niveau maximum, y compris les villes, temples et châteaux de vos barons vassaux dans vos comtés."
 mqa_b_max_all_buildings_sub_realm_decision_tooltip:0 ""
 mqa_b_max_all_buildings_sub_realm_decision_ct:0 "Bâtissons"
 mqa_b_lucky_7_sub_realm_decision_title:0 "#EMP Monarque Absolu :#! Fortifier et armer le domaine"
 mqa_b_lucky_7_sub_realm_decision_desc:0 "Fonde des temples et des villes dans les baronnies vides de vos comtés, puis remplit les emplacements de votre domaine, propriétés de vos barons vassaux comprises, avec les meilleurs bâtiments que le jeu y autorise : d'abord la fortification adaptée au terrain, puis les plus grosses levées, puis l'or. Les bâtiments moins utiles sont remplacés, puis tout est amélioré au niveau maximum. Aucun emplacement n'est ajouté, aucune innovation n'est requise."
 mqa_b_lucky_7_sub_realm_decision_tooltip:0 ""
 mqa_b_lucky_7_sub_realm_decision_ct:0 "Aux armes et à l'ouvrage"
 mqa_b_max_domicile_decision_title:0 "#EMP Monarque Absolu :#! La maison de rêve"
 mqa_b_max_domicile_decision_desc:0 "Remplit tous les emplacements libres de votre domicile (camp, domaine, yourte, manoir...), emplacements internes compris, et améliore chaque bâtiment jusqu'à son niveau maximum. Les bâtiments à bonus militaires passent d'abord, puis l'or et les ressources ; les spécialisations sont choisies de la même façon."
 mqa_b_max_domicile_decision_tooltip:0 ""
 mqa_b_max_domicile_decision_ct:0 "Rien n'est trop beau pour Versailles"
