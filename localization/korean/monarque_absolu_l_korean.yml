 mqa_b_grant_baronies_decision_title:0 "#EMP Monarque Absolu:#! 부차적 남작령 수여"
 mqa_b_grant_baronies_decision_desc:0 "직접 보유한 해당 부차적 도시, 사원, 성채와 사원 성채를 기존 및 신규 여부와 무관하게 문화, 신앙, 전례가 같은 새 귀족에게 수여하여 직속 봉신으로 삼습니다. 개인 직할령 수가 줄어들 수 있습니다. 백작령 수도, 진행 중인 공사, 임대 작위와 성직자 사원은 보호하며 다른 남작은 작위를 유지합니다. 건설이나 봉토 전환은 하지 않습니다."
