l_korean:
 # Menus
 interaction_mqa_main:0 "Monarque Absolu"
 decision_group_type_mqa:0 "--= Monarque Absolu =--"

 # Traits
 trait_mqa_immortality:0 "Mélusine"
 trait_mqa_immortality_desc:0 "전설 속 불멸의 요정 Mélusine처럼, 이 인물은 25세보다 늙어 보이지 않으며, 그 통치를 끝낼 수 있는 것은 칼날이나 독뿐입니다."
 trait_mqa_immortality_character_desc:0 "전설 속 불멸의 요정 Mélusine처럼, [ROOT.GetCharacter.GetFirstNameNoTooltip]은(는) 25세보다 늙어 보이지 않으며, 그 통치를 끝낼 수 있는 것은 칼날이나 독뿐입니다."
 trait_mqa_super:0 "Louis XIV"
 trait_mqa_super_desc:0 "“L'État, c'est moi.(짐이 곧 국가다)” 태양왕처럼, 이 군주는 비할 데 없는 능력, 바닥나지 않는 재물, 강철 같은 건강, 그리고 모든 변덕에 따르는 궁정을 지녔습니다."
 trait_mqa_super_character_desc:0 "“L'État, c'est moi.(짐이 곧 국가다)” 태양왕처럼, [ROOT.GetCharacter.GetFirstNameNoTooltip]은(는) 비할 데 없는 능력, 바닥나지 않는 재물, 강철 같은 건강, 그리고 모든 변덕에 따르는 궁정을 지녔습니다."
 trait_mqa_super_governor:0 "Colbert"
 trait_mqa_super_governor_desc:0 "태양왕의 지칠 줄 모르는 대신 Colbert처럼, 이 행정가는 땅을 번영시키고, 건물을 하룻밤 사이에 세우며, 모든 봉신이 의무를 다하게 합니다."
 trait_mqa_super_governor_character_desc:0 "태양왕의 지칠 줄 모르는 대신 Colbert처럼, [ROOT.GetCharacter.GetFirstNameNoTooltip]은(는) 땅을 번영시키고, 건물을 하룻밤 사이에 세우며, 모든 봉신이 의무를 다하게 합니다."
 trait_mqa_super_general:0 "Napoléon"
 trait_mqa_super_general_desc:0 "Napoléon처럼, 이 지휘관이 이끄는 군대는 더 빨리 진군하고, 더 강하게 싸우며, 어떤 요새든 며칠 만에 함락시킵니다."
 trait_mqa_super_general_character_desc:0 "Napoléon처럼, [ROOT.GetCharacter.GetFirstNameNoTooltip]이(가) 이끄는 군대는 더 빨리 진군하고, 더 강하게 싸우며, 어떤 요새든 며칠 만에 함락시킵니다."

 # Interactions
 mqa_immortal_interaction:0 "Mélusine의 축복 내리기"
 mqa_immortal_interaction_desc:0 "[recipient.GetShortUINameNoTooltip|U]은(는) #underline Mélusine#!을(를) 얻습니다. 25세 이후로 늙지 않으며 자연사하지 않습니다."
 mqa_mortal_interaction:0 "Mélusine의 축복 거두기"
 mqa_mortal_interaction_desc:0 "[recipient.GetShortUINameNoTooltip|U]은(는) 다시 필멸자가 되어 다른 이들처럼 늙어 갑니다."
 mqa_super_interaction:0 "Louis XIV로 만들기"
 mqa_super_interaction_desc:0 "[recipient.GetShortUINameNoTooltip|U]은(는) #underline Louis XIV#!을(를) 얻습니다. 모든 능력치 100, 막대한 수입과 자원, 건강, 수태력, 모략 보너스와 보호, 그리고 훨씬 높은 직할령과 봉신 한계."
 mqa_unsuper_interaction:0 "Louis XIV 거두기"
 mqa_unsuper_interaction_desc:0 "[recipient.GetShortUINameNoTooltip|U]은(는) Louis XIV의 모든 보너스를 잃습니다."
 mqa_super_governor_interaction:0 "Colbert로 만들기"
 mqa_super_governor_interaction_desc:0 "[recipient.GetShortUINameNoTooltip|U]은(는) #underline Colbert#!을(를) 얻습니다. 거의 즉시 무료로 완료되는 건설, 백작령의 장악력과 개발도, 더 많은 징집병과 세금, 그리고 더 큰 봉신 기여."
 mqa_unsuper_governor_interaction:0 "Colbert 거두기"
 mqa_unsuper_governor_interaction_desc:0 "[recipient.GetShortUINameNoTooltip|U]은(는) Colbert의 모든 보너스를 잃습니다."
 mqa_super_general_interaction:0 "Napoléon으로 만들기"
 mqa_super_general_interaction_desc:0 "[recipient.GetShortUINameNoTooltip|U]은(는) #underline Napoléon#!을(를) 얻습니다. 압도적인 전투 우위, 번개 같은 공성과 행군, 끝없는 보급, 그리고 더 강한 상비군과 기사."
 mqa_unsuper_general_interaction:0 "Napoléon 거두기"
 mqa_unsuper_general_interaction_desc:0 "[recipient.GetShortUINameNoTooltip|U]은(는) Napoléon의 모든 보너스를 잃습니다."
 mqa_all_in_one_interaction:0 "절대 권력을 내리기"
 mqa_all_in_one_interaction_desc:0 "[recipient.GetShortUINameNoTooltip|U]은(는) Louis XIV, Colbert, Napoléon이 한꺼번에 됩니다."
 mqa_unall_in_one_interaction:0 "모든 권능 거두기"
 mqa_unall_in_one_interaction_desc:0 "[recipient.GetShortUINameNoTooltip|U]은(는) Louis XIV, Colbert, Napoléon을 잃습니다."
 mqa_perfect_bloodline_interaction:0 "완벽한 혈통"
 mqa_perfect_bloodline_interaction_desc:0 "[recipient.GetShortUINameNoTooltip|U]은(는) 최고의 유전 특성(#EMP 아름다운, 천재, 초인, 다산의#!)을 얻고 모든 유전적 결함을 잃습니다. 친자식들도 같은 장점을 지니고 태어나 이를 다시 물려줍니다."
 mqa_unperfect_bloodline_interaction:0 "완벽한 혈통 끝내기"
 mqa_unperfect_bloodline_interaction_desc:0 "[recipient.GetShortUINameNoTooltip|U]은(는) 현재 특성을 유지하지만, 앞으로 태어날 자녀에게 완벽한 혈통을 더 이상 물려주지 않습니다."
 mqa_max_education_interaction:0 "완벽한 교육"
 mqa_max_education_interaction_desc:0 "[recipient.GetShortUINameNoTooltip]의 교육 특성이 해당 계열의 최고 단계로 올라갑니다."
 mqa_all_perks_interaction:0 "모든 특성"
 mqa_all_perks_interaction_desc:0 "[recipient.GetShortUINameNoTooltip|U]은(는) 모든 생활 방식의 모든 특성을 한 번에 해금하고, 각 계통을 완성하는 특성도 얻습니다."
 mqa_take_title_interaction:0 "작위 빼앗기"
 mqa_take_title_interaction_desc:0 "[recipient.GetShortUINameNoTooltip]의 작위 중 하나를 빼앗습니다. 영지 없는 작위와 행정 작위도 포함됩니다. 작위만, 또는 그 아래 영지를 보유한 봉신들과 함께 빼앗을 수 있습니다."
 mqa_take_title_only_option:0 "작위만: 원래 주군이 여전히 더 높은 등급이면 봉신들은 그 곁에 남습니다"
 mqa_take_title_and_vassals_option:0 "작위와 봉신: 봉신들이 당신에게 충성을 맹세합니다"
 mqa_take_realm_interaction:0 "모든 작위 빼앗기"
 mqa_take_realm_interaction_desc:0 "[recipient.GetShortUINameNoTooltip]이(가) 보유한 모든 작위를 한꺼번에 빼앗거나, 봉신들의 백작령과 공작령을 포함해 왕국 전체의 모든 작위를 빼앗습니다."
 mqa_take_domain_option:0 "직할령: 봉신들이 당신에게 충성을 맹세합니다"
 mqa_take_realm_option:0 "왕국 전체: 봉신들은 백작령과 공작령을 잃습니다"
 mqa_claim_realm_interaction:0 "모든 영지에 대한 명분 획득"
 mqa_claim_realm_interaction_desc:0 "[recipient.GetShortUINameNoTooltip](이)가 보유한 작위 또는 봉신의 작위를 포함한 봉역 내 모든 작위에 대한 압박 명분을 획득합니다. 작위 소유자와 봉신의 주군은 바뀌지 않습니다."
 mqa_claim_domain_option:0 "직할령: 대상이 직접 보유한 작위에만 명분 획득"
 mqa_claim_realm_option:0 "봉역 전체: 대상과 모든 봉신의 작위에 명분 획득"

 # Decisions
 mqa_show_decision_title:0 "--= #EMP Monarque Absolu:#! 권능 표시 =--"
 mqa_show_decision_desc:0 "Monarque Absolu 결단을 표시합니다."
 mqa_show_decision_tooltip:0 ""
 mqa_show_decision_ct:0 "Qu'on les montre"
 mqa_hide_decision_title:0 "--= #EMP Monarque Absolu:#! 권능 숨기기 =--"
 mqa_hide_decision_desc:0 "Monarque Absolu 결단을 숨깁니다."
 mqa_hide_decision_tooltip:0 ""
 mqa_hide_decision_ct:0 "Qu'on les cache"
 mqa_money_decision_title:0 "#EMP Monarque Absolu:#! 금고 채우기"
 mqa_money_decision_desc:0 "금화, 신앙도, 위신, 명성 +100,000, 그리고 당신이 사용하는 다른 모든 자원: 정통성, 영향력, 공적, 국고, 궁정 위엄, 영적 충만, 가축 또는 보급품."
 mqa_money_decision_tooltip:0 "금화, 신앙도, 위신, 명성 +100,000, 그리고 당신이 사용하는 다른 모든 자원: 정통성, 영향력, 공적, 국고, 궁정 위엄, 영적 충만, 가축 또는 보급품."
 mqa_money_decision_ct:0 "L'État, c'est moi"
 mqa_subrealm_to_culture_decision_title:0 "#EMP Monarque Absolu:#! 하나의 왕국, 하나의 문화"
 mqa_subrealm_to_culture_decision_desc:0 "하위 왕국, 봉신, 가족, 집안을 당신의 문화로 바꿉니다."
 mqa_subrealm_to_culture_decision_tooltip:0 "하위 왕국, 봉신, 가족, 집안을 당신의 문화로 바꿉니다."
 mqa_subrealm_to_culture_decision_ct:0 "Ainsi soit-il"
 mqa_convert_subrealm_to_religion_decision_title:0 "#EMP Monarque Absolu:#! 하나의 왕국, 하나의 신앙"
 mqa_convert_subrealm_to_religion_decision_desc:0 "하위 왕국, 봉신, 가족, 집안을 당신의 신앙과 교파로 개종시킵니다."
 mqa_convert_subrealm_to_religion_decision_tooltip:0 "하위 왕국, 봉신, 가족, 집안을 당신의 신앙과 교파로 개종시킵니다."
 mqa_convert_subrealm_to_religion_decision_ct:0 "Un roi, une foi, une loi"
 mqa_gather_realm_decision_title:0 "#EMP Monarque Absolu:#! 왕국 통합"
 mqa_gather_realm_decision_desc:0 "당신의 공작령, 왕국과 제국에 법률상 속하지만 당신의 영역 밖에서 보유하고 있는 모든 백작령, 공작령, 왕국을 전쟁 없이 되찾습니다. 백작령은 그 남작들과 함께 옵니다. 당신의 작위 밖의 것은 건드리지 않으며, 당신의 봉신들은 보유한 것을 유지합니다."
 mqa_gather_realm_decision_tooltip:0 ""
 mqa_gather_realm_decision_ct:0 "Montjoie ! Saint-Denis !"
 mqa_gather_realm_decision_effect_tt:0 "당신의 공작령, 왕국과 제국에 법률상 속하며 외국 군주가 보유한 모든 백작령, 공작령, 왕국이 당신의 것이 됩니다."
 mqa_council_on_decision_title:0 "#EMP Monarque Absolu:#! 특별한 의회"
 mqa_council_on_decision_desc:0 "각 의회 의원은 직책의 기술에 +100을 얻습니다. 재상은 외교, 원수는 군사, 집사는 관리, 첩보 대장은 음모, 궁정 사제는 학식이며, 행정 장관도 포함됩니다. 새 의원은 한 달 안에 얻고, 의회를 떠나는 의원은 잃습니다."
 mqa_council_on_decision_tooltip:0 ""
 mqa_council_on_decision_ct:0 "Le Roi en son Conseil"
 mqa_council_on_decision_effect_tt:0 "의원들은 직책을 맡는 동안 그 기술에 +100을 얻습니다."
 mqa_council_off_decision_title:0 "#EMP Monarque Absolu:#! 평범한 의회"
 mqa_council_off_decision_desc:0 "의원들은 특별한 의회의 보너스를 잃습니다."
 mqa_council_off_decision_tooltip:0 ""
 mqa_council_off_decision_ct:0 "Le Conseil est levé"
 mqa_council_off_decision_effect_tt:0 "의원들은 +100 보너스를 잃습니다."
 mqa_council_diplomacy_modifier:0 "특별한 의회: 외교"
 mqa_council_diplomacy_modifier_desc:0 "군주가 부여한, 의회 직책 기술 +100."
 mqa_council_martial_modifier:0 "특별한 의회: 군사"
 mqa_council_martial_modifier_desc:0 "군주가 부여한, 의회 직책 기술 +100."
 mqa_council_stewardship_modifier:0 "특별한 의회: 관리"
 mqa_council_stewardship_modifier_desc:0 "군주가 부여한, 의회 직책 기술 +100."
 mqa_council_intrigue_modifier:0 "특별한 의회: 음모"
 mqa_council_intrigue_modifier_desc:0 "군주가 부여한, 의회 직책 기술 +100."
 mqa_council_learning_modifier:0 "특별한 의회: 학식"
 mqa_council_learning_modifier_desc:0 "군주가 부여한, 의회 직책 기술 +100."
 mqa_cure_all_decision_title:0 "#EMP Monarque Absolu:#! 몸과 왕국을 치유하기"
 mqa_cure_all_decision_desc:0 "왕국의 모든 질병을 치료하고, 가장 가까운 혈족의 부상과 장애도 치료합니다."
 mqa_cure_all_decision_tooltip:0 "왕국 전체의 모든 질병을 치료하고, 당신과 배우자, 자녀, 손주의 부상과 장애를 치료합니다."
 mqa_cure_all_decision_ct:0 "Le roi te touche, Dieu te guérit"
 mqa_cure_inbred_decision_title:0 "#EMP Monarque Absolu:#! 혈통 정화"
 mqa_cure_inbred_decision_desc:0 "가장 가까운 혈족에게서 모든 유전적 결함을 없앱니다."
 mqa_cure_inbred_decision_tooltip:0 "당신과 배우자, 자녀, 손주에게서 숨겨진 것을 포함한 모든 부정적 유전 특성을 제거합니다."
 mqa_cure_inbred_decision_ct:0 "Bon sang ne saurait mentir"

 # Building decisions
 mqa_b_show_decision_title:0 "--= #EMP Monarque Absolu:#! 건축가의 권능 표시 =--"
 mqa_b_show_decision_desc:0 "Monarque Absolu 건설 결단을 표시합니다."
 mqa_b_show_decision_tooltip:0 ""
 mqa_b_show_decision_ct:0 "Qu'on les montre"
 mqa_b_hide_decision_title:0 "--= #EMP Monarque Absolu:#! 건축가의 권능 숨기기 =--"
 mqa_b_hide_decision_desc:0 "Monarque Absolu 건설 결단을 숨깁니다."
 mqa_b_hide_decision_tooltip:0 ""
 mqa_b_hide_decision_ct:0 "Qu'on les cache"
 mqa_b_lucky_7_sub_realm_decision_title:0 "#EMP Monarque Absolu:#! 직할령 요새화와 무장"
 mqa_b_lucky_7_sub_realm_decision_desc:0 "자신의 백작령에 있는 기존 봉토(봉신 남작 포함)와 해당 백작령 밖에서 직접 보유한 남작령의 건물 슬롯을 채우고 건물을 강화합니다. 게임 조건에 따라 방어, 징집병, 수입을 우선하며 우선순위가 낮은 건물을 교체할 수 있습니다. 진행 중인 공사는 보호하며 비용과 시간은 생략하고 슬롯은 추가하지 않습니다. 봉토를 신설하거나 전환하지 않으며 작위를 수여하지 않습니다."
 mqa_b_lucky_7_sub_realm_decision_tooltip:0 "$mqa_b_domain_effect_tt$"
 mqa_b_lucky_7_sub_realm_decision_ct:0 "Aux armes et à l'ouvrage"
 mqa_b_max_domicile_decision_title:0 "#EMP Monarque Absolu:#! 꿈의 집"
 mqa_b_max_domicile_decision_desc:0 "당신의 거처(야영지, 영지, 유르트, 장원 등)의 내부 칸을 포함한 모든 빈 칸을 채우고, 모든 건물을 게임이 허용하는 만큼 업그레이드합니다. 직접 지을 수 있는 건물만 지어집니다. 군사 보너스가 있는 건물이 먼저, 그다음 금화와 자원이며, 특화도 같은 기준으로 선택됩니다. 거처에서 진행 중인 건설은 먼저 취소되며, 직접 취소한 것처럼 환불됩니다."
 mqa_b_max_domicile_decision_tooltip:0 "$mqa_b_domicile_effect_tt$"
 mqa_b_max_domicile_decision_ct:0 "Rien n'est trop beau pour Versailles"

 # Building decision summaries and diagnostic logs (stable English log markers).
 mqa_b_domain_effect_tt:0 "$mqa_b_lucky_7_sub_realm_decision_desc$"
 mqa_b_domicile_effect_tt:0 "일반 건설 조건에 따라 거처를 건설하고 개선합니다. 진행 중인 공사는 먼저 취소하고 비용을 환불합니다."

 mqa_b_found_holdings_decision_title:0 "#EMP Monarque Absolu:#! 새 봉토 건설"
 mqa_b_found_holdings_decision_desc:0 "자신의 백작령 내 수도가 아닌 빈 남작령에 게임 조건에 따라 부족한 정체에 맞는 사원(만다라는 사원 성채), 도시, 이후 성채를 건설합니다. 부족 및 유목 정체는 제외하며 진행 중인 공사는 보호하고 비용과 시간은 생략합니다. 추가 건물이나 명시적 작위 수여는 없지만 게임이 새 봉토 일부의 소유자를 자동 지정할 수 있습니다."
