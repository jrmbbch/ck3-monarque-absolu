 mqa_b_convert_holdings_decision_title:0 "#EMP Monarque Absolu:#! 봉토를 성채로 전환"
 mqa_b_convert_holdings_decision_desc:0 "모드의 전환 조건에 따라 자신의 해당 부족, 유목 및 목축 봉토를 백작령 수도를 포함하여 성채로 전환합니다. 부족과 초원 정체가 아닌 통치자가 지배하는 공사 중이 아닌 봉토만 해당합니다. 금화 비용은 없습니다. 봉토 신설, 건물 강화, 작위 수여는 하지 않습니다."
