l_japanese:
 # Menus
 interaction_mqa_main:0 "Monarque Absolu"
 decision_group_type_mqa:0 "--= Monarque Absolu =--"

 # Traits
 trait_mqa_immortality:0 "Mélusine"
 trait_mqa_immortality_desc:0 "伝説の不死の妖精Mélusineのように、この人物は25歳より老けて見えることはなく、その治世を終わらせられるのは刃か毒だけである。"
 trait_mqa_immortality_character_desc:0 "伝説の不死の妖精Mélusineのように、[ROOT.GetCharacter.GetFirstNameNoTooltip]は25歳より老けて見えることはなく、その治世を終わらせられるのは刃か毒だけである。"
 trait_mqa_super:0 "Louis XIV"
 trait_mqa_super_desc:0 "「L'État, c'est moi.（朕は国家なり）」太陽王のように、この君主は比類なき能力、尽きぬ財、鉄の健康、そしてあらゆる気まぐれに従う宮廷を持つ。"
 trait_mqa_super_character_desc:0 "「L'État, c'est moi.（朕は国家なり）」太陽王のように、[ROOT.GetCharacter.GetFirstNameNoTooltip]は比類なき能力、尽きぬ財、鉄の健康、そしてあらゆる気まぐれに従う宮廷を持つ。"
 trait_mqa_super_governor:0 "Colbert"
 trait_mqa_super_governor_desc:0 "太陽王の不屈の大臣Colbertのように、この行政官は領地を栄えさせ、建物を一夜にして建て、すべての封臣に務めを果たさせる。"
 trait_mqa_super_governor_character_desc:0 "太陽王の不屈の大臣Colbertのように、[ROOT.GetCharacter.GetFirstNameNoTooltip]は領地を栄えさせ、建物を一夜にして建て、すべての封臣に務めを果たさせる。"
 trait_mqa_super_general:0 "Napoléon"
 trait_mqa_super_general_desc:0 "Napoléonのように、この指揮官が率いる軍は速く進み、強く戦い、どんな要塞も数日で落とす。"
 trait_mqa_super_general_character_desc:0 "Napoléonのように、[ROOT.GetCharacter.GetFirstNameNoTooltip]が率いる軍は速く進み、強く戦い、どんな要塞も数日で落とす。"

 # Interactions
 mqa_immortal_interaction:0 "Mélusineの加護を授ける"
 mqa_immortal_interaction_desc:0 "[recipient.GetShortUINameNoTooltip|U]は#underline Mélusine#!を得る。25歳を過ぎて老いることも、自然死することもない。"
 mqa_mortal_interaction:0 "Mélusineの加護を取り上げる"
 mqa_mortal_interaction_desc:0 "[recipient.GetShortUINameNoTooltip|U]は再び定命の身となり、皆と同じように老いていく。"
 mqa_super_interaction:0 "Louis XIVにする"
 mqa_super_interaction_desc:0 "[recipient.GetShortUINameNoTooltip|U]は#underline Louis XIV#!を得る。すべての能力値が100になり、莫大な収入と資源、健康、生殖力、工作のボーナスと防御、そして大幅に高い直轄領と封臣の上限。"
 mqa_unsuper_interaction:0 "Louis XIVを取り上げる"
 mqa_unsuper_interaction_desc:0 "[recipient.GetShortUINameNoTooltip|U]はLouis XIVのボーナスをすべて失う。"
 mqa_super_governor_interaction:0 "Colbertにする"
 mqa_super_governor_interaction_desc:0 "[recipient.GetShortUINameNoTooltip|U]は#underline Colbert#!を得る。ほぼ即時かつ無料の建設、伯領の統制度と開発度、より多くの徴募兵と税、そして封臣からのより大きな貢献。"
 mqa_unsuper_governor_interaction:0 "Colbertを取り上げる"
 mqa_unsuper_governor_interaction_desc:0 "[recipient.GetShortUINameNoTooltip|U]はColbertのボーナスをすべて失う。"
 mqa_super_general_interaction:0 "Napoléonにする"
 mqa_super_general_interaction_desc:0 "[recipient.GetShortUINameNoTooltip|U]は#underline Napoléon#!を得る。戦闘での圧倒的優位、電光石火の包囲と行軍、尽きない補給、そしてより強い兵科と騎士。"
 mqa_unsuper_general_interaction:0 "Napoléonを取り上げる"
 mqa_unsuper_general_interaction_desc:0 "[recipient.GetShortUINameNoTooltip|U]はNapoléonのボーナスをすべて失う。"
 mqa_all_in_one_interaction:0 "絶対的な力を授ける"
 mqa_all_in_one_interaction_desc:0 "[recipient.GetShortUINameNoTooltip|U]はLouis XIV、Colbert、Napoléonのすべてとなる。"
 mqa_unall_in_one_interaction:0 "すべての力を取り上げる"
 mqa_unall_in_one_interaction_desc:0 "[recipient.GetShortUINameNoTooltip|U]はLouis XIV、Colbert、Napoléonを失う。"
 mqa_perfect_bloodline_interaction:0 "完璧な血統"
 mqa_perfect_bloodline_interaction_desc:0 "[recipient.GetShortUINameNoTooltip|U]は最良の遺伝特性（#EMP 華麗、天才、神の、多産#!）を得て、あらゆる遺伝的欠陥を失う。実子も同じ長所を持って生まれ、さらに次の世代へと受け継ぐ。"
 mqa_unperfect_bloodline_interaction:0 "完璧な血統を終わらせる"
 mqa_unperfect_bloodline_interaction_desc:0 "[recipient.GetShortUINameNoTooltip|U]は現在の特性を保持するが、今後生まれる子に完璧な血統を受け継がせなくなる。"
 mqa_max_education_interaction:0 "完璧な教育"
 mqa_max_education_interaction_desc:0 "[recipient.GetShortUINameNoTooltip]の教育特性が、その系統の最高位まで上がる。"
 mqa_all_perks_interaction:0 "すべての特典"
 mqa_all_perks_interaction_desc:0 "[recipient.GetShortUINameNoTooltip|U]はすべてのライフスタイルの特典を一度に解放し、各ツリーの頂点となる特性も得る。"
 mqa_take_title_interaction:0 "称号を奪う"
 mqa_take_title_interaction_desc:0 "[recipient.GetShortUINameNoTooltip]の称号の一つを奪う。土地なし称号や行政称号も含む。"
 mqa_take_title_and_vassals_interaction:0 "称号を封臣ごと奪う"
 mqa_take_landless_title_interaction:0 "土地なし称号を奪う"
 mqa_take_realm_interaction:0 "直轄領か国を奪う"
 mqa_take_realm_interaction_desc:0 "[recipient.GetShortUINameNoTooltip]の称号をすべて一度に奪う。または封臣の称号も含めて国全体を奪う。"
 mqa_take_domain_interaction:0 "直轄領を奪う"
 mqa_take_domain_as_vassal_interaction:0 "直轄領を奪い、その主君に仕える"
 mqa_take_realm_as_vassal_interaction:0 "国を奪い、その主君に仕える"

 # Decisions
 mqa_show_decision_title:0 "--= #EMP Monarque Absolu：#! 力を表示 =--"
 mqa_show_decision_desc:0 "Monarque Absoluの決断を表示する。"
 mqa_show_decision_tooltip:0 ""
 mqa_show_decision_ct:0 "Qu'on les montre"
 mqa_hide_decision_title:0 "--= #EMP Monarque Absolu：#! 力を隠す =--"
 mqa_hide_decision_desc:0 "Monarque Absoluの決断を隠す。"
 mqa_hide_decision_tooltip:0 ""
 mqa_hide_decision_ct:0 "Qu'on les cache"
 mqa_money_decision_title:0 "#EMP Monarque Absolu：#! 金庫を満たす"
 mqa_money_decision_desc:0 "金・敬虔点・威信点・栄誉点を+100,000。さらに、あなたが使う他のすべての資源も：正統性、影響力、功績、国庫、宮廷の威光、精神的充足、家畜、糧秣。"
 mqa_money_decision_tooltip:0 "金・敬虔点・威信点・栄誉点を+100,000。さらに、あなたが使う他のすべての資源も：正統性、影響力、功績、国庫、宮廷の威光、精神的充足、家畜、糧秣。"
 mqa_money_decision_ct:0 "L'État, c'est moi"
 mqa_subrealm_to_culture_decision_title:0 "#EMP Monarque Absolu：#! 一つの国、一つの文化"
 mqa_subrealm_to_culture_decision_desc:0 "配下の領域、封臣、一族、家をあなたの文化に改める。"
 mqa_subrealm_to_culture_decision_tooltip:0 "配下の領域、封臣、一族、家をあなたの文化に改める。"
 mqa_subrealm_to_culture_decision_ct:0 "Ainsi soit-il"
 mqa_convert_subrealm_to_religion_decision_title:0 "#EMP Monarque Absolu：#! 一つの国、一つの信仰"
 mqa_convert_subrealm_to_religion_decision_desc:0 "配下の領域、封臣、一族、家をあなたの宗派と流派に改宗させる。"
 mqa_convert_subrealm_to_religion_decision_tooltip:0 "配下の領域、封臣、一族、家をあなたの宗派と流派に改宗させる。"
 mqa_convert_subrealm_to_religion_decision_ct:0 "Un roi, une foi, une loi"
 mqa_cure_all_decision_title:0 "#EMP Monarque Absolu：#! 身と国を癒す"
 mqa_cure_all_decision_desc:0 "国中のあらゆる病を癒し、さらに最も近い身内の傷と障害も癒す。"
 mqa_cure_all_decision_tooltip:0 "領内全体のすべての病気を治し、さらにあなた、配偶者、子、孫の負傷と障害を治す。"
 mqa_cure_all_decision_ct:0 "Le roi te touche, Dieu te guérit"
 mqa_cure_inbred_decision_title:0 "#EMP Monarque Absolu：#! 血統を清める"
 mqa_cure_inbred_decision_desc:0 "最も近い身内からあらゆる遺伝的欠陥を取り除く。"
 mqa_cure_inbred_decision_tooltip:0 "あなた、配偶者、子、孫から、隠れたものも含めてすべての負の遺伝特性を取り除く。"
 mqa_cure_inbred_decision_ct:0 "Bon sang ne saurait mentir"

 # Building decisions
 mqa_b_show_decision_title:0 "--= #EMP Monarque Absolu：#! 建築家の力を表示 =--"
 mqa_b_show_decision_desc:0 "Monarque Absoluの建設決断を表示する。"
 mqa_b_show_decision_tooltip:0 ""
 mqa_b_show_decision_ct:0 "Qu'on les montre"
 mqa_b_hide_decision_title:0 "--= #EMP Monarque Absolu：#! 建築家の力を隠す =--"
 mqa_b_hide_decision_desc:0 "Monarque Absoluの建設決断を隠す。"
 mqa_b_hide_decision_tooltip:0 ""
 mqa_b_hide_decision_ct:0 "Qu'on les cache"
 mqa_b_lucky_7_sub_realm_decision_title:0 "#EMP Monarque Absolu：#! 直轄領を固め、武装する"
 mqa_b_lucky_7_sub_realm_decision_desc:0 "あなたの伯領の空いた男爵領に寺院と都市を建て、その後あなたの直轄領（封臣の男爵の領分を含む）の建設枠を、ゲームが許可する最良の建造物で埋める。最初は地形に合った防御施設、次に徴募兵の多さ、その次に金。劣る建造物は置き換えられ、その後すべてがゲームの許す限り強化される。自分で建設できるものだけが建てられ、技術革新と保有地のレベルが条件となる。建設枠は追加されない。"
 mqa_b_lucky_7_sub_realm_decision_tooltip:0 ""
 mqa_b_lucky_7_sub_realm_decision_ct:0 "Aux armes et à l'ouvrage"
 mqa_b_ongoing_constructions_warning:0 "@warning_icon! #warning あなたの直轄領で建設中のもの：[GetPlayer.MakeScope.ScriptValue('mqa_b_ongoing_constructions_value')|0]。この決定では中止できず、その建設枠は埋まったままになる。枠を埋めるには先に自分で中止すること。#!"
 mqa_b_max_domicile_decision_title:0 "#EMP Monarque Absolu：#! 夢のマイホーム"
 mqa_b_max_domicile_decision_desc:0 "あなたの住居（野営地、屋敷、ユルト、荘園など）の空き枠を内部枠も含めてすべて埋め、すべての建物をゲームの許す限り強化する。自分で建設できるものだけが建てられる。軍事ボーナスのある建物が最優先、次に金と資源。専門化も同じ基準で選ばれる。 住居で建設中のものはまず中止され、自分で中止した場合と同様に返金される。"
 mqa_b_max_domicile_decision_tooltip:0 ""
 mqa_b_max_domicile_decision_ct:0 "Rien n'est trop beau pour Versailles"
